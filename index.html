function tileAt(tx, ty) { if (ty < 0 || ty >= ROWS) return '.'; if (tx < 0 || tx >= lv.w) return 'G'; return lv.g[ty][tx]; }
// 화면 위(ty<0)는 비어 있지만, 보스 문(W) 칸은 하늘 끝까지 막혀 있어요(보스를 밟고 문을 뛰어넘지 못하게)
function solid(tx, ty) { if (ty < 0) return tx >= 0 && tx < lv.w && lv.g[0][tx] === 'W'; if (ty >= ROWS) return false; if (tx < 0 || tx >= lv.w) return true; return SOLID.has(lv.g[ty][tx]); }
function standable(tx, ty) { const c = tileAt(tx, ty); return SOLID.has(c) || c === '-'; }
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function moveBox(e, dt) {
  const res = {wall: 0, ground: false, head: null};
  e.x += e.vx * dt;
  const ya = Math.floor(e.y / T), yb = Math.floor((e.y + e.h - 0.01) / T);
  if (e.vx > 0) {
    const tx = Math.floor((e.x + e.w) / T);
    for (let ty = ya; ty <= yb; ty++) if (solid(tx, ty)) { e.x = tx * T - e.w - 0.01; res.wall = 1; break; }
  } else if (e.vx < 0) {
    const tx = Math.floor(e.x / T);
    for (let ty = ya; ty <= yb; ty++) if (solid(tx, ty)) { e.x = (tx + 1) * T + 0.01; res.wall = -1; break; }
  }
  const pb = e.y + e.h;
  e.y += e.vy * dt;
  const xa = Math.floor((e.x + 1) / T), xb = Math.floor((e.x + e.w - 1) / T);
  if (e.vy >= 0) {
    const ty = Math.floor((e.y + e.h) / T);
    for (let tx = xa; tx <= xb; tx++) {
      const c = tileAt(tx, ty);
      if (SOLID.has(c) || (c === '-' && pb <= ty * T + 1)) { e.y = ty * T - e.h; e.vy = 0; res.ground = true; break; }
    }
  } else {
    const ty = Math.floor(e.y / T), cx = Math.floor((e.x + e.w / 2) / T);
    let hit = -1;
    for (let tx = xa; tx <= xb; tx++) if (solid(tx, ty) && (hit < 0 || tx === cx)) hit = tx;
    if (hit >= 0) { e.y = (ty + 1) * T; e.vy = 0; if (ty >= 0) res.head = {tx: hit, ty}; }
  }
  return res;
}

function hitBlock(tx, ty) {
  const c = lv.g[ty][tx];
  bumps.set(tx + ',' + ty, 0.18);
  if (c === '?') {
    lv.g[ty][tx] = 'U'; stats.candy++;
    parts.push({k:'pop', x:tx * T + T / 2, y:ty * T - 6, vx:0, vy:-280, life:0.55, max:0.55});
    sfx.candy();
  } else if (c === '!') {
    lv.g[ty][tx] = 'U';
    const dir = (p.x + p.w / 2 < tx * T + T / 2) ? 1 : -1;
    ents.push({t:'sprout', x:tx * T + 5, y:ty * T, w:22, h:22, vx:0, vy:0, emerge:0.5, top:ty * T - 22, dir, sp:70});
    sfx.sprout();
  } else sfx.bonk();
  const above = {x: tx * T, y: ty * T - 6, w: T, h: 6};
  for (const e of ents) if ((e.t === 'snail' || e.t === 'frog' || e.t === 'crab') && !e.dead && overlap(e, above)) squash(e);
}

function squash(e) {
  e.dead = true; e.sq = 0.5;
  if (e.t === 'bee') { e.vy = -120; e.fallY = e.y; }
  for (let i = 0; i < 6; i++) parts.push({k:'poof', x:e.x + e.w / 2, y:e.y + e.h / 2, vx:Math.cos(i) * 80, vy:Math.sin(i) * 80 - 30, life:0.4, max:0.4});
}

function hurt() {
  if (p.inv > 0 || mode !== 'play') return;
  if (p.shield) { p.shield = false; p.inv = 1.5; sfx.hurt(); toast('보호막이 지켜 줬어요!', 1.2); return; }
  p.hearts--; p.inv = 1.6; p.vy = p.swim ? -120 : -320; p.vx = -p.face * (p.swim ? 100 : 160); sfx.hurt();
  if (p.hearts <= 0) outOfHearts();
}

function outOfHearts() {
  if (play === 'endless') { endEndless(); return; }
  if (D().restart) { loadLevel(idx, p.power); p.inv = 1.6; toast('처음부터 다시 도전!', 1.6); return; }
  p.hearts = D().hearts;
  const b = ents.find(e => e.t === 'boss' && e.active && !e.dead && !e.gone);
  if (b && p.x > b.ax0 - T && p.x < b.gate * T) bossLost(b);
  else toast('괜찮아요, 다시 해 봐요!', 1.6);
  respawnPlayer();
}

function fallDown() {
  sfx.fall(); p.hearts--;
  if (p.hearts <= 0) { outOfHearts(); return; }
  toast('앗! 다시 출발', 1.2);
  respawnPlayer();
}

function respawnPlayer() {
  p.x = respawn.x; p.y = respawn.foot - p.h; p.vx = p.vy = 0; p.inv = 1.6; p.plat = null; p.boost = false; p.swim = false;
  cam = Math.max(0, Math.min(lv.w * T - vw, p.x - vw * 0.4));
}

function win() {
  mode = 'clearing'; clearT = 0; p.vx = 0; sfx.clear();
  releaseTouches();
  for (let i = 0; i < 70; i++) parts.push({k:'conf', x:cam + Math.random() * vw, y:-10 - Math.random() * 120,
    vx:(Math.random() - 0.5) * 60, vy:60 + Math.random() * 120, life:2.6, max:2.6, rot:Math.random() * 6,
    col:['#ff6b8a', '#ffc93c', '#5cbf4a', '#4aa8ff', '#b388ff'][i % 5]});
  const r = R(), first = !r.best[idx] && !r.stars[idx] && !r.crown[idx], crownNew = stats.boss && !r.crown[idx];
  r.stars[idx] = Math.max(r.stars[idx], stats.stars);
  if (stats.boss) r.crown[idx] = true;
  stats.newBest = !r.best[idx] || stats.time < r.best[idx];
  if (stats.newBest) r.best[idx] = Math.round(stats.time * 10) / 10;
  // 메달: 아이템 없이 시작한 판만, 더 좋은 메달만 남겨요
  stats.medalOK = medalOK; stats.prevMedal = r.medal[idx] || 0;
  stats.medal = medalOK ? medalOf(idx, stats.time) : 0;
  if (stats.medal > stats.prevMedal) r.medal[idx] = stats.medal;
  // 사탕 저금: 모은 사탕 + 큰 별×5, 이 난이도에서 전에 깬 단계면 절반(올림), 보스 왕관 처음이면 +20
  let earn = stats.candy + stats.stars * 5;
  if (!first) earn = Math.ceil(earn / 2);
  if (crownNew) earn += 20;
  stats.earn = earn; SL().wallet = Math.min(999999, SL().wallet + earn);
  SL().unlocked = Math.max(SL().unlocked, Math.min(LEVELS.length, idx + 2));
  stats.saved = save();
}

// ---------- 헤엄 ----------
// 누르면 위로 140, 계속 누르면 떠오르고, 놓으면 천천히(최대 90) 가라앉아요. 물 밖으로 나갈 때 버튼을 누르고 있으면 '물 밖 점프'(약 2칸).
const SWIM_RUN = 120, SWIM_ACC = 600, SWIM_UP = 140, SWIM_PULL = 600, SWIM_SINK = 300, SWIM_FALL = 90, SWIM_OUT = 480;
function waterAt(x, y) {
  if (!lv || !lv.waters) return null;
  for (const q of lv.waters) if (x >= q.x0 * T && x < (q.x1 + 1) * T && y > q.top * T + 4) return q;
  return null;
}
function updateSwim(dt, ax, ctl, fast) {
  const acc = SWIM_ACC * fast, d = ax * SWIM_RUN * fast - p.vx;
  p.vx += Math.max(-acc * dt, Math.min(acc * dt, d));
  if (jumpQueued) { jumpQueued = false; if (ctl) { p.vy = -SWIM_UP; sfx.swim(); } }
  else if (ctl && inp.jump) p.vy = Math.max(-SWIM_UP, p.vy - SWIM_PULL * dt);
  else if (p.vy > SWIM_FALL) p.vy = Math.max(SWIM_FALL, p.vy - 1500 * dt);
  else p.vy = Math.min(SWIM_FALL, p.vy + SWIM_SINK * dt);
  p.buffer = 0; p.coyote = 0; p.boost = false; p.plat = null;
  p.pb = p.y + p.h; p.fallV = p.vy;
  const r = moveBox(p, dt);
  p.ground = r.ground;
  if (r.head && ctl) hitBlock(r.head.tx, r.head.ty);
  p.walk += Math.abs(p.vx) * dt * 0.05;
  if (p.inv > 0) p.inv -= dt;
}

function updatePlayer(dt) {
  const ctl = mode === 'play';
  const ax = ctl ? (inp.right ? 1 : 0) - (inp.left ? 1 : 0) : 0;
  if (ax) p.face = ax;
  const fast = p.power === 'speed' ? 1.25 : 1;
  const wasSwim = p.swim;
  p.swim = !!waterAt(p.x + p.w / 2, p.y + p.h / 2);
  if (p.swim) { if (!wasSwim) sparkle(p.x + p.w / 2, p.y + 4, '#ffffff', 6); updateSwim(dt, ax, ctl, fast); return; }
  if (wasSwim && ctl && inp.jump && p.vy < 0) { p.vy = -SWIM_OUT; p.boost = true; sfx.jump(); }
  const acc = (p.ground ? ACC_G : ACC_A) * fast, d = ax * RUN * fast - p.vx;
  p.vx += Math.max(-acc * dt, Math.min(acc * dt, d));
  p.coyote = p.ground ? 0.1 : p.coyote - dt;
  p.buffer -= dt;
  if (jumpQueued) { p.buffer = 0.15; jumpQueued = false; }
  if (ctl && p.buffer > 0 && p.coyote > 0) {
    p.vy = -JUMP; p.buffer = 0; p.coyote = 0; p.ground = false; p.plat = null; p.boost = false; sfx.jump();
  }
  if (!inp.jump && !p.boost && p.vy < -260) p.vy = -260;
  p.vy = Math.min(p.vy + GRAV * dt, MAXFALL);
  if (p.plat) { p.x += p.plat.dx; p.y += p.plat.dy; }
  p.pb = p.y + p.h; p.fallV = p.vy;
  const r = moveBox(p, dt);
  p.ground = r.ground; p.plat = null;
  if (!p.ground && p.vy >= 0) {
    for (const c of ents) if (c.t === 'cloud' && p.pb <= c.y + 0.5 && p.y + p.h >= c.y && p.x + p.w > c.x + 2 && p.x < c.x + c.w - 2) {
      p.y = c.y - p.h; p.vy = 0; p.ground = true; p.plat = c; break;
    }
  }
  if (r.head && ctl) hitBlock(r.head.tx, r.head.ty);
  if (p.ground) { p.boost = false; p.walk += Math.abs(p.vx) * dt * 0.07; }
  if (p.inv > 0) p.inv -= dt;
  if (p.y > VH + 40) { if (ctl) fallDown(); else { p.y = VH + 40; p.vy = 0; } }
}

function touchEnemy(e) {
  const hb = {x: e.x + 3, y: e.y + 3, w: e.w - 6, h: e.h - 3};
  if (!overlap(p, hb) || mode !== 'play') return;
  if (p.fallV > 0 && p.pb <= e.y + e.h * 0.6) {
    squash(e); p.vy = p.swim ? -120 : inp.jump ? -STOMP_HI : -STOMP; p.boost = !p.swim && inp.jump; p.ground = false; sfx.stomp();
  } else if (p.power === 'big') { squash(e); sfx.stomp(); }
  else hurt();
}

// ---------- 아이템 ----------
function setPower(k) {
  p.power = k; itemCd = 0.6; sfx.power(); sparkle(p.x + p.w / 2, p.y + p.h / 2, '#ffd23f', 14);
  toast(`${POWERS[k]}! ` + {boom: '던지기 버튼을 눌러요', speed: '쌩쌩 달려요', big: '닿기만 해도 적을 물리쳐요'}[k], 1.8);
}
function throwBoom() {
  if (mode !== 'play' || !p || p.power !== 'boom' || boomOut) return;
  boomOut = true; sfx.throw();
  ents.push({t:'boom', x:p.x + p.w / 2 - 10, y:p.y + 4, w:20, h:20, dir:p.face, vx:p.face * 460, back:false, life:0, hitBoss:false});
}
function updateBoom(e, dt) {
  e.life += dt;
  if (!e.back) { e.vx -= e.dir * 650 * dt; e.x += e.vx * dt; if (e.dir * e.vx <= 0) e.back = true; }
  else {
    const dx = p.x + p.w / 2 - (e.x + 10), dy = p.y + p.h / 2 - (e.y + 10), dd = Math.hypot(dx, dy) || 1;
    e.x += dx / dd * 480 * dt; e.y += dy / dd * 480 * dt;
    if (dd < 18) e.gone = true;
  }
  if (e.life > 3) e.gone = true;
  if (e.gone) { boomOut = false; return; }
  for (const o of ents) {
    if (o.gone || o.dead) continue;
    if (['snail', 'bee', 'frog', 'crab', 'jelly', 'shark'].includes(o.t) && overlap(e, o)) { squash(o); sfx.stomp(); }
    else if (o.t === 'boss' && o.active && !e.hitBoss && o.inv <= 0 && !(o.kind === 'snail' && o.st === 'hide') && !(o.kind === 'octo' && o.st !== 'weak') && overlap(e, o)) { e.hitBoss = true; bossHit(o); }
  }
}

// ---------- 보스 ----------
function bossDefeatMinions() { for (const o of ents) if (o.minion && !o.dead) squash(o); for (const o of ents) if (o.t === 'wave' || o.t === 'tent' || o.t === 'ink') o.gone = true; }
function openGate(col, msg) {
  for (let r = 0; r < ROWS; r++) if (lv.g[r][col] === 'W') { lv.g[r][col] = '.'; sparkle(col * T + 16, r * T + 16, '#ffd23f', 4); }
  if (msg) toast(msg, 2.4);
}
function bossLost(b) {
  b.losses++;
  b.x = b.sx; b.y = bossHome(b.kind, b.h); b.vx = b.vy = 0; b.st = 'idle'; b.tm = 0; b.active = false; b.inv = 0; b.cyc = 0;
  bossDefeatMinions();
  // 대왕 문어는 어떤 난이도에서도 그냥 지나갈 수 없어요(남은 체력은 그대로)
  if (D().bypass && b.kind !== 'octo' && b.losses >= D().bypass && !b.bypass) { b.bypass = true; openGate(b.gate, '문이 열렸어요! 그냥 지나가도 돼요 (비밀의 방은 이겨야 열려요)'); sfx.check(); }
  else toast(`${b.name}에게 졌어요. 다시 해 봐요!`, 1.8);
}
function bossHit(b) {
  b.hp--; b.inv = 1; sfx.bossHit(); sparkle(b.x + b.w / 2, b.y + 6, '#ffffff', 12);
  if (b.kind === 'snail') { b.st = 'hide'; b.tm = 0; b.vx = 0; }
  if (b.kind === 'bee' && b.st === 'rest') { b.st = 'rise'; b.tm = 0; }
  if (b.kind === 'octo') { b.st = 'rise'; b.tm = 0; }
  if (b.hp <= 0) {
    b.dead = true; b.sq = 0.9; stats.boss = true; sfx.clear(); bossDefeatMinions();
    for (let i = 0; i < 14; i++) parts.push({k:'poof', x:b.x + b.w / 2, y:b.y + b.h / 2, vx:Math.cos(i) * 140, vy:Math.sin(i) * 140 - 40, life:0.6, max:0.6});
    if (b.kind === 'octo') { openGate(b.gate, '대왕 문어를 물리쳤어요! 깃발로 가요!'); sfx.door(); return; }
    openGate(b.gate);
    ents.push({t:'door', x:b.door * T, y:5 * T, w:T, h:2 * T, used:false});
    toast(`${b.name}를 물리쳤어요! 발판 위 비밀 문으로!`, 2.4);
  } else toast(`${b.name} 남은 힘 ${b.hp}`, 1);
}
function bossTouch(b) {
  const hb = {x: b.x + 4, y: b.y + 4, w: b.w - 8, h: b.h - 4};
  if (mode !== 'play' || !overlap(p, hb)) return;
  const shell = b.kind === 'snail' && b.st === 'hide';
  const low = b.kind === 'octo' ? b.st === 'weak' : !(b.kind === 'bee' && b.y + b.h < 8 * T);
  // 대왕 문어는 '헉헉'일 때만 밟을 수 있어요. 머리 몸통이 아픈 건 내려올 때(down)뿐이고(그림자로 미리 보여요),
  // 올라갈 때·떠 있을 때 닿으면 아무 일도 없어요(튀어 오르지 않아 머리를 타고 문을 못 넘어요)
  if (b.kind === 'octo' && !low) { if (b.inv <= 0 && b.st === 'down' && p.pb > b.y + b.h * 0.5) hurt(); return; }
  if (p.fallV > 0 && p.pb <= b.y + b.h * 0.5) {
    p.vy = -560; p.boost = true; p.ground = false;
    if (b.inv <= 0 && !shell && low) bossHit(b); else sfx.bonk();
  } else if (b.inv <= 0 && !shell && !(b.kind === 'octo' && b.st === 'weak')) hurt();
}
function addMinion(b, kind) {
  const n = ents.filter(o => o.minion && !o.dead && !o.gone).length;
  if (n >= 2) return;
  const x = Math.floor((b.ax0 + 64 + hash(time) * (b.ax1 - b.ax0 - 128)) / T);
  const m = spawn(kind === 'bee' ? {t:'bee', x, r:8} : {t:'snail', x, r:2});
  m.minion = true; ents.push(m); sparkle(m.x + 14, m.y + 10, '#ffffff', 6);
}
function updateBoss(b, dt) {
  if (b.dead) { b.sq -= dt; if (b.sq <= 0) b.gone = true; return; }
  const gy = 10 * T;
  if (!b.active) {
    if (b.kind === 'bee') b.y = 3 * T + Math.sin(time * 2) * 6;
    if (mode === 'play' && p.x > b.trig && p.x < b.gate * T) {
      b.active = true; b.st = 'start'; b.tm = 0; sfx.boss();
      toast(`${b.name} 등장! ` + {snail: '머리를 밟아요', bee: '내려왔을 때 밟아요', frog: '착지하면 밟아요', octo: '촉수를 피하고, 머리가 내려오면 밟아요'}[b.kind], 2.4);
    }
    return;
  }
  b.inv = Math.max(0, b.inv - dt); b.tm += dt; b.minT += dt;
  const pc = p.x + p.w / 2, bc = b.x + b.w / 2, dir = pc < bc ? -1 : 1;
  if (b.kind === 'octo') { updateOcto(b, dt, pc, bc, dir); b.x = Math.max(b.ax0, Math.min(b.ax1 - b.w, b.x)); bossTouch(b); return; }
  if (b.kind === 'snail') {
    const sp = 55 * b.bf * (1 + (b.max - b.hp) * 0.15);
    if (b.st === 'start') { b.st = 'walk'; b.face = dir; b.tm = 0; }
    if (b.st === 'walk') {
      b.vx = b.face * sp;
      if (b.tm > 3 && WI() < 4) { b.face = dir; b.tm = 0; }
      if (WI() >= 4 && b.tm > 3.5) { b.st = 'shake'; b.tm = 0; }
    } else if (b.st === 'shake') { b.vx = 0; if (b.tm > 0.8) { b.st = 'dash'; b.face = dir; b.tm = 0; } }
    else if (b.st === 'dash') { b.vx = b.face * sp * 3; if (b.tm > 1.4) { b.st = 'tired'; b.tm = 0; } }
    else if (b.st === 'tired') { b.vx = 0; if (b.tm > b.win) { b.st = 'walk'; b.face = dir; b.tm = 0; } }
    else if (b.st === 'hide') { b.vx = 0; if (b.tm > 1.2) { b.st = 'walk'; b.face = dir; b.tm = 0; } }
    b.vy = Math.min(b.vy + GRAV * dt, MAXFALL);
    const r = moveBox(b, dt); b.ground = r.ground;
    if (b.x <= b.ax0 + 1 && b.face < 0) { b.face = 1; if (b.st === 'dash') { b.st = 'tired'; b.tm = 0; } }
    if (b.x + b.w >= b.ax1 - 1 && b.face > 0) { b.face = -1; if (b.st === 'dash') { b.st = 'tired'; b.tm = 0; } }
    if (WI() >= 7 && b.minT > 6) { b.minT = 0; addMinion(b, 'snail'); }
  } else if (b.kind === 'bee') {
    const top = 3 * T, hoverT = WI() >= 6 ? 1.6 : 2.6;
    if (b.st === 'start') { b.st = 'hover'; b.tm = 0; }
    if (b.st === 'hover') {
      b.y += (top - b.y) * Math.min(1, dt * 3);
      b.x += Math.max(-80 * b.bf * dt, Math.min(80 * b.bf * dt, pc - bc)); b.face = dir;
      if (b.tm > hoverT) { b.st = 'warn'; b.tm = 0; }
    } else if (b.st === 'warn') { if (b.tm > 0.8) { b.st = 'dive'; b.tm = 0; } }
    else if (b.st === 'dive') { b.y += 320 * b.bf * dt; if (b.y + b.h >= gy) { b.y = gy - b.h; b.st = 'rest'; b.tm = 0; sfx.bonk(); } }
    else if (b.st === 'rest') { if (b.tm > b.win + 0.3) { b.st = 'rise'; b.tm = 0; } }
    else if (b.st === 'rise') { b.y -= 200 * b.bf * dt; if (b.y <= top) { b.y = top; b.st = 'hover'; b.tm = 0; } }
    if (WI() >= 8 && b.minT > 7) { b.minT = 0; addMinion(b, 'bee'); }
  } else {
    if (b.st === 'start') { b.st = 'wait'; b.tm = 0; }
    b.vy = Math.min(b.vy + GRAV * dt, MAXFALL);
    const wasAir = !b.ground, r = moveBox(b, dt); b.ground = r.ground;
    if (b.st === 'wait') { b.vx = 0; if (b.tm > Math.max(0.5, 1.3 - WI() * 0.05)) { b.st = 'crouch'; b.tm = 0; b.face = dir; } }
    else if (b.st === 'crouch') { if (b.tm > 0.6) { b.hops = 0; frogJump(b, pc); } }
    else if (b.st === 'jump') {
      if (b.ground && wasAir) {
        b.vx = 0;
        if (WI() >= 8) for (const s of [-1, 1]) ents.push({t:'wave', x:b.x + b.w / 2 - 10, y:gy - 14, w:20, h:14, vx:s * 170, x0:b.ax0, x1:b.ax1});
        if (WI() >= 5 && b.hops < 2) frogJump(b, pc); else { b.st = 'land'; b.tm = 0; }
      }
    } else if (b.st === 'land') { b.vx = 0; if (b.tm > b.win) { b.st = 'wait'; b.tm = 0; } }
  }
  b.x = Math.max(b.ax0, Math.min(b.ax1 - b.w, b.x));
  bossTouch(b);
}
function frogJump(b, pc) {
  b.hops++; b.st = 'jump'; b.tm = 0;
  const dir = pc < b.x + b.w / 2 ? -1 : 1, dist = Math.max(48, Math.min(240, Math.abs(pc - b.x - b.w / 2)));
  b.face = dir; b.vy = b.hops > 1 ? -480 : -640; b.vx = dir * Math.min(280 * b.bf, dist / 0.7); b.ground = false;
}

// 대왕 문어: 위에 떠서 따라옴 → (촉수 | 먹물) → 머리가 내려와 '헉헉'(밟을 수 있음) → 다시 올라감. 촉수와 먹물을 번갈아 써요.
function updateOcto(b, dt, pc, bc, dir) {
  const gy = 10 * T, top = 2 * T, low = gy - 8 - b.h;
  if (b.st === 'start') { b.st = 'hover'; b.tm = 0; }
  // 공격하는 동안에도 머리는 콩콩이 위로 천천히(110, 콩콩이 190보다 느려요) 따라와요 → 내려오면 늘 가까이 있어서 밟으러 갈 수 있어요
  if (b.st === 'tAtk' || b.st === 'iAfter') { b.x += Math.max(-110 * dt, Math.min(110 * dt, pc - bc)); b.face = dir; }
  // 먹물 예고('!') 동안엔 뒤로 물러나요 → 먹물은 머리 옆에서 나와서 점프할 틈이 있어요
  if (b.st === 'iWarn') { b.x -= dir * 110 * dt; b.face = dir; }
  if (b.st === 'hover') {
    b.y += (top - b.y) * Math.min(1, dt * 3);
    b.x += Math.max(-70 * dt, Math.min(70 * dt, pc - bc)); b.face = dir;
    if (b.tm > (b.weak < 1.2 ? 0.7 : 1.0)) {
      b.tm = 0;
      if (b.cyc++ % 2 === 0) { b.st = 'tAtk'; octoTentacles(b, pc); } else b.st = 'iWarn';
    }
  } else if (b.st === 'tAtk') { if (b.tm > b.warnT + 0.85) { b.st = 'down'; b.tm = 0; } }
  else if (b.st === 'iWarn') {
    if (b.tm > b.warnT) {
      ents.push({t:'ink', x:bc + dir * b.w / 2 - 10, y:gy - 20, w:20, h:20, vx:dir * b.inkSp, x0:b.ax0, x1:b.ax1});
      sfx.throw(); b.st = 'iAfter'; b.tm = 0;
    }
  } else if (b.st === 'iAfter') { if (b.tm > 0.5) { b.st = 'down'; b.tm = 0; } }
  else if (b.st === 'down') { b.y += 320 * dt; if (b.y >= low) { b.y = low; b.st = 'weak'; b.tm = 0; sfx.bonk(); } }
  else if (b.st === 'weak') { b.y = low; if (b.tm > b.weak) { b.st = 'rise'; b.tm = 0; } }
  else if (b.st === 'rise') { b.y -= 240 * dt; if (b.y <= top) { b.y = top; b.st = 'hover'; b.tm = 0; } }
}
// 촉수: 콩콩이가 있던 자리 + 5칸씩 떨어진 자리(체력 절반부터 3개). 촉수 사이엔 4칸이 비어요. 예고 자리는 움직이지 않아요.
function octoTentacles(b, pc) {
  const a0 = Math.ceil(b.ax0 / T) + 1, a1 = Math.floor(b.ax1 / T) - 2, c0 = Math.max(a0, Math.min(a1, Math.floor(pc / T)));
  const n = b.hp <= b.max / 2 ? 3 : 2, cols = [];
  for (const k of [0, 5, -5, 10, -10]) { const c = c0 + k; if (c >= a0 && c <= a1 && cols.length < n) cols.push(c); }
  for (const c of cols) ents.push({t:'tent', x:c * T + 4, w:24, base:10 * T, y:10 * T, h:0, full:2.5 * T, st:'warn', tm:0, warn:b.warnT});
}

// ---------- 비밀의 방 ----------
function enterRoom(door) {
  door.used = true; sfx.door();
  mainSave = {lv, ents, door, cam};
  lv = {name:ROOM.name, w:ROOM.w, th:THEMES[ROOM.theme], home:false, g:ROOM.g.map(r => r.slice()), room:true};
  ents = ROOM.ents.map(spawn); boomOut = false;
  stats.total += ents.filter(e => e.t === 'candy').length;
  p.x = 3 * T + 5; p.y = 10 * T - p.h; p.vx = p.vy = 0; p.plat = null; cam = 0; bumps.clear();
  toast('비밀의 방! 갖고 싶은 아이템 아래에서 점프!', 2.4);
}
function exitRoom() {
  const m = mainSave; mainSave = null; sfx.door();
  lv = m.lv; ents = m.ents; boomOut = false; bumps.clear();
  p.x = (m.door.x / T + 3) * T + 5; p.y = 10 * T - p.h; p.vx = p.vy = 0; p.plat = null; p.inv = 1;
  respawn = {x: p.x, foot: 10 * T};
  cam = Math.max(0, Math.min(lv.w * T - vw, p.x - vw * 0.4));
  toast(p.power ? `${POWERS[p.power]} 가지고 출발!` : '다시 출발!', 1.6);
}

function updateEnts(dt) {
  const list = ents;
  for (const e of list) {
    if (ents !== list) break;
    if (e.gone) continue;
    switch (e.t) {
      case 'candy':
        if (overlap(p, e)) { e.gone = true; stats.candy++; sfx.candy(); sparkle(e.x + 9, e.y + 9, '#ffd23f', 5); }
        break;
      case 'star':
        if (overlap(p, e)) { e.gone = true; stats.stars++; sfx.star(); sparkle(e.x + 13, e.y + 13, '#ffd23f', 12); toast(`큰 별 ${stats.stars}/3`, 1.2); }
        break;
      case 'jelly':
        if (e.dead) { e.vy = (e.vy || 0) + GRAV * 0.3 * dt; e.y += e.vy * dt; if (e.y > VH + 40) e.gone = true; break; }
        e.y = e.y0 + Math.sin(time * Math.PI * 2 / (3.2 / EF()) + e.ph) * T;
        if (mode === 'play' && overlap(p, {x: e.x + 3, y: e.y + 3, w: e.w - 6, h: e.h - 6})) hurt();
        break;
      case 'shark':
        if (e.dead) { e.vy = (e.vy || 0) + GRAV * 0.3 * dt; e.y += e.vy * dt; if (e.y > VH + 40) e.gone = true; break; }
        if (e.wait > 0) e.wait -= dt;
        else {
          e.x += e.vx * dt;
          if (e.x > e.x1) { e.x = e.x1; e.vx = -Math.abs(e.vx); e.wait = 0.6; }
          if (e.x < e.x0) { e.x = e.x0; e.vx = Math.abs(e.vx); e.wait = 0.6; }
        }
        if (mode === 'play' && overlap(p, {x: e.x + 5, y: e.y + 4, w: e.w - 10, h: e.h - 7})) hurt();
        break;
      case 'snail': case 'crab':
        if (e.dead) { e.sq -= dt; if (e.sq <= 0) e.gone = true; break; }
        if (e.ground) {
          const fx = e.vx > 0 ? e.x + e.w + 1 : e.x - 1;
          if (!standable(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T))) e.vx = -e.vx;
          // 가시 앞에서도 돌아서요(가시 사이 섬으로 걸어 들어오지 않게)
          else if (ents.some(s => s.t === 'spike' && fx >= s.x && fx < s.x + s.w && Math.abs(s.y + s.h - e.y - e.h) < 8)) e.vx = -e.vx;
        }
        e.vy = Math.min(e.vy + GRAV * dt, MAXFALL);
        { const r = moveBox(e, dt); if (r.wall) e.vx = -r.wall * e.sp; e.ground = r.ground; }
        if (e.y > VH + 40) e.gone = true;
        touchEnemy(e);
        break;
      case 'bee':
        if (e.dead) { e.vy += GRAV * dt; e.y += e.vy * dt; if (e.y > VH + 40) e.gone = true; break; }
        e.y = e.y0 + Math.sin(time * 2 * EF() + e.ph) * 30;
        touchEnemy(e);
        break;
      case 'frog':
        if (e.dead) { e.sq -= dt; if (e.sq <= 0) e.gone = true; break; }
        e.vy = Math.min(e.vy + GRAV * dt, MAXFALL);
        { const r = moveBox(e, dt); if (r.wall) e.vx = 0; e.ground = r.ground; }
        if (e.ground) {
          e.vx = 0; e.wait -= dt;
          const dist = p.x - e.x;
          if (e.wait <= 0 && Math.abs(dist) < 9 * T && mode === 'play') {
            e.wait = 1.5 / EF() + hash(e.x + time) * 0.4;
            const dir = dist < 0 ? -1 : 1, land = Math.floor((e.x + e.w / 2 + dir * 1.7 * T) / T), row = Math.floor((e.y + e.h + 2) / T);
            e.face = dir; e.vx = (standable(land, row) || standable(land, row + 1)) ? dir * 95 : 0; e.vy = -520; e.ground = false;
          }
        }
        if (e.y > VH + 40) e.gone = true;
        touchEnemy(e);
        break;
      case 'spike':
        if (mode === 'play' && overlap(p, {x: e.x + 5, y: e.y + 5, w: e.w - 10, h: e.h - 5})) hurt();
        break;
      case 'spring':
        e.sq = Math.max(0, e.sq - dt * 4);
        if (p.fallV > 0 && p.pb <= e.y + 10 && overlap(p, e) && mode === 'play') {
          p.y = e.y - p.h; p.vy = -SPRING; p.boost = true; p.ground = false; p.plat = null; e.sq = 1; sfx.spring();
        }
        break;
      case 'check':
        if (!e.on && overlap(p, e)) {
          // 다시 시작할 때 도움닫기 할 수 있게, 같은 높이 땅이 이어지면 최대 3칸 왼쪽에서 시작해요
          let rc = e.col; while (rc > e.col - 3 && standable(rc - 1, e.row + 1) && !solid(rc - 1, e.row) && !standable(rc - 1, e.row)) rc--;
          e.on = true; respawn = {x: rc * T + 5, foot: (e.row + 1) * T};
          sfx.check(); toast('중간 깃발!', 1.2); sparkle(e.x + 8, (e.row - 2) * T + 10, '#ff6b8a', 10);
        }
        break;
      case 'goal':
        if (mode === 'play' && overlap(p, e)) win();
        break;
      case 'boss': updateBoss(e, dt); break;
      case 'boom': updateBoom(e, dt); break;
      case 'wave':
        e.x += e.vx * dt;
        if (e.x < e.x0 || e.x + e.w > e.x1) e.gone = true;
        else if (mode === 'play' && overlap(p, {x: e.x + 3, y: e.y + 3, w: e.w - 6, h: e.h - 3})) hurt();
        break;
      case 'tent':
        e.tm += dt;
        if (e.st === 'warn') { if (e.tm > e.warn) { e.st = 'up'; e.tm = 0; sfx.stomp(); } }
        else if (e.st === 'up') { e.h = Math.min(e.full, e.h + e.full * dt / 0.12); if (e.tm > 0.6) { e.st = 'back'; e.tm = 0; } }
        else { e.h -= e.full * dt / 0.2; if (e.h <= 0) e.gone = true; }
        e.y = e.base - e.h;
        if (e.h > 12 && mode === 'play' && overlap(p, {x: e.x + 3, y: e.y + 4, w: e.w - 6, h: e.h - 4})) hurt();
        break;
      case 'ink':
        e.x += e.vx * dt;
        if (e.x < e.x0 || e.x + e.w > e.x1) e.gone = true;
        else if (mode === 'play' && overlap(p, {x: e.x + 3, y: e.y + 3, w: e.w - 6, h: e.h - 3})) hurt();
        break;
      case 'door':
        if (!e.used && mode === 'play' && p.ground && overlap(p, {x: e.x + 6, y: e.y, w: e.w - 12, h: e.h})) enterRoom(e);
        break;
      case 'exit':
        if (mode === 'play' && overlap(p, {x: e.x + 8, y: e.y, w: e.w - 16, h: e.h})) exitRoom();
        break;
      case 'item':
        if (mode === 'play' && itemCd <= 0 && p.power !== e.k && overlap(p, e)) setPower(e.k);
        break;
      case 'sprout':
        if (e.emerge > 0) { e.emerge -= dt; e.y = e.top + (e.emerge / 0.5) * 22; if (e.emerge <= 0) { e.y = e.top; e.vx = e.dir * e.sp; } }
        else {
          e.vy = Math.min(e.vy + GRAV * dt, MAXFALL);
          const r = moveBox(e, dt); if (r.wall) e.vx = -r.wall * e.sp;
          if (e.y > VH + 40) e.gone = true;
        }
        if (!e.gone && overlap(p, e) && mode === 'play') {
          e.gone = true;
          if (p.shield) { stats.candy += 5; toast('사탕 +5', 1); } else { p.shield = true; toast('새싹 보호막!', 1.3); }
          sfx.power(); sparkle(e.x + 11, e.y + 11, '#8be06d', 12);
        }
        break;
    }
  }
}

function sparkle(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    parts.push({k:'spark', x, y, vx:Math.cos(a) * 110, vy:Math.sin(a) * 110, life:0.45, max:0.45, col});
  }
}

function update(dt) {
  time += dt;
  if (mode !== 'play' && mode !== 'clearing') return;
  inp.left = keys.left || touch.left; inp.right = keys.right || touch.right; inp.jump = keys.jump || touch.jump;
  if (mode === 'play') stats.time += dt;
  itemCd = Math.max(0, itemCd - dt);
  for (const e of ents) if (e.t === 'cloud') {
    if (e.axis === 'y') {
      let ny = e.y + e.vy * dt;
      if (ny < e.y0) { ny = e.y0; e.vy = Math.abs(e.vy); }
      if (ny > e.y1) { ny = e.y1; e.vy = -Math.abs(e.vy); }
      e.dy = ny - e.y; e.y = ny;
    } else {
      if (e.pause > 0) { e.pause -= dt; e.dx = 0; continue; }
      let nx = e.x + e.vx * dt;
      if (nx > e.x1) { nx = e.x1; e.vx = -Math.abs(e.vx); if (e.turtle) e.pause = 1; }
      if (nx < e.x0) { nx = e.x0; e.vx = Math.abs(e.vx); if (e.turtle) e.pause = 1; }
      e.dx = nx - e.x; e.x = nx;
    }
  }
  updatePlayer(dt);
  if (play === 'endless') updateEndless();
  trailTick(dt);
  updateEnts(dt);
  for (const q of parts) {
    q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
    if (q.k === 'pop') q.vy += 900 * dt;
    if (q.k === 'conf') q.rot += dt * 5;
  }
  parts = parts.filter(q => q.life > 0);
  for (const [k, v] of bumps) { if (v - dt <= 0) bumps.delete(k); else bumps.set(k, v - dt); }
  const target = p.x + p.w / 2 - vw * 0.4;
  cam += (target - cam) * Math.min(1, dt * 8);
  cam = Math.max(0, Math.min(lv.w * T - vw, cam));
  if (mode === 'clearing') { clearT += dt; if (clearT > 1.9) showClear(); }
}

// ---------- 그리기 ----------
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2); }
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function puff(x, y, s, col) {
  ctx.fillStyle = col;
  ell(x, y, 34 * s, 16 * s); ctx.fill(); ell(x - 22 * s, y + 4 * s, 20 * s, 12 * s); ctx.fill();
  ell(x + 22 * s, y + 4 * s, 22 * s, 12 * s); ctx.fill(); ell(x + 2 * s, y - 10 * s, 20 * s, 14 * s); ctx.fill();
}

function drawBG(th) {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, vw + 2, VH);
  if (th.stars) {
    const span = vw + 20;
    for (let i = 0; i < 70; i++) {
      const x = ((hash(i) * 3000 - cam * 0.05) % span + span) % span, y = hash(i + 50) * 240;
      ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(time * 1.5 + i)); ctx.fillStyle = '#fff8d0'; ell(x, y, 1.4, 1.4); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  if (th.sun) { ctx.fillStyle = th.sun; ell(vw - 80, 62, 28, 28); ctx.fill(); ctx.globalAlpha = 0.3; ell(vw - 80, 62, 40, 40); ctx.fill(); ctx.globalAlpha = 1; }
  if (th.moon) { ctx.fillStyle = th.sky[0]; ell(vw - 68, 54, 24, 24); ctx.fill(); }
  if (th.cave) {
    ctx.fillStyle = th.deco;
    const off = cam * 0.3, sp = 70, st = Math.floor(off / sp) - 1;
    for (let k = st; k < st + vw / sp + 3; k++) {
      const x = k * sp - off, len = 30 + hash(k) * 60;
      ctx.beginPath(); ctx.moveTo(x - 14, 0); ctx.lineTo(x + 14, 0); ctx.lineTo(x, len); ctx.fill();
    }
    const off2 = cam * 0.5, sp2 = 130, st2 = Math.floor(off2 / sp2) - 1;
    for (let k = st2; k < st2 + vw / sp2 + 3; k++) {
      const x = k * sp2 - off2 + hash(k + 7) * 50, y = 90 + hash(k + 3) * 150, s = 4 + hash(k + 9) * 5;
      ctx.globalAlpha = 0.45 + 0.35 * Math.sin(time * 2 + k);
      ctx.fillStyle = th.crystal; ctx.beginPath(); ctx.moveTo(x, y - s * 2); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s * 2); ctx.lineTo(x - s, y); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  if (th.clouds) {
    const n = th.manyClouds ? 9 : 5, span = vw + 400;
    for (let i = 0; i < n; i++) {
      const f = th.manyClouds ? 0.08 + (i % 3) * 0.08 : 0.12;
      const x = (((i * 290 + hash(i) * 120 - cam * f) % span) + span) % span - 200;
      const y = 40 + hash(i + 5) * (th.manyClouds ? 240 : 100);
      ctx.globalAlpha = th.manyClouds ? 0.85 : 0.95;
      puff(x, y, 0.8 + hash(i + 2) * 0.7, th.clouds);
      ctx.globalAlpha = 1;
    }
  }
  if (th.castle) {
    const off = cam * 0.22, sp = 260, st = Math.floor(off / sp) - 1;
    ctx.fillStyle = th.deco;
    for (let k = st; k < st + vw / sp + 3; k++) {
      const x = k * sp - off, h = 110 + hash(k) * 80, base = 300;
      ctx.fillRect(x, base - h, 46, h + 90);
      ctx.beginPath(); ctx.moveTo(x - 8, base - h); ctx.lineTo(x + 23, base - h - 46); ctx.lineTo(x + 54, base - h); ctx.fill();
      ctx.fillRect(x + 46, base - h * 0.6, 70, h + 90);
      for (let j = 0; j < 4; j++) ctx.fillRect(x + 46 + j * 20, base - h * 0.6 - 12, 12, 12);
    }
  }
  for (const [col, f, base, amp, sp] of th.hills) {
    ctx.fillStyle = col;
    const off = cam * f, st = Math.floor(off / sp) - 1;
    for (let k = st; k < st + vw / sp + 3; k++) {
      const x = k * sp - off, r = sp * 0.6 + hash(k * 3 + base) * amp;
      ell(x, base + r * 0.62, r, r); ctx.fill();
    }
    ctx.fillRect(0, base + 30, vw + 2, VH);
  }
  if (th.ocean) {
    ctx.fillStyle = th.ocean; ctx.fillRect(0, 232, vw + 2, 70);
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    for (let k = 0; k < vw / 60 + 2; k++) ctx.fillRect(k * 60 - (cam * 0.15 % 60) + Math.sin(time + k) * 6, 240 + (k % 3) * 14, 22, 2);
  }
  if (th.bubbles) {
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (let i = 0; i < 26; i++) {
      const x = ((hash(i) * 2000 - cam * 0.2) % (vw + 40) + vw + 40) % (vw + 40), y = VH - ((time * (18 + hash(i + 9) * 22) + hash(i + 4) * VH) % VH);
      ell(x, y, 2 + hash(i + 2) * 3, 2 + hash(i + 2) * 3); ctx.fill();
    }
    ctx.fillStyle = 'rgba(30,90,140,.35)';
    const off = cam * 0.45, sp = 90, st = Math.floor(off / sp) - 1;
    for (let k = st; k < st + vw / sp + 3; k++) {
      const x = k * sp - off + hash(k) * 40, h = 40 + hash(k + 3) * 60, sw = Math.sin(time * 1.5 + k) * 6;

  ctx.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.6, y - s * 1.1, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.9); ctx.closePath();
}
function drawTrail(kind, x, y, a, hue) {
  if (kind === 'stars') { ctx.fillStyle = '#ffe066'; starPath(x, y, 2 + 4 * a, 1 + 2 * a); ctx.fill(); }
  else if (kind === 'hearts') { ctx.fillStyle = '#ff6b8a'; heartPath(x, y, 2 + 3 * a); ctx.fill(); }
  else if (kind === 'bubbles') { ctx.strokeStyle = '#7fd8ff'; ctx.lineWidth = 1.5; ell(x, y, 3 + (1 - a) * 4, 3 + (1 - a) * 4); ctx.stroke(); ctx.fillStyle = '#ffffff'; ell(x - 1.5, y - 1.5, 1, 1); ctx.fill(); }
  else if (kind === 'rainbow') { ctx.fillStyle = `hsl(${hue},90%,65%)`; ell(x, y, 2 + 3 * a, 2 + 3 * a); ctx.fill(); }
}
// 달릴 때 뒤에 반짝이를 남겨요
function trailTick(dt) {
  const k = wearOf().trail;
  if (k === 'none' || mode !== 'play' || !p || Math.abs(p.vx) < 60) return;
  trailT -= dt; if (trailT > 0) return; trailT = 0.07;
  parts.push({k: 'trail', kind: k, x: p.x + p.w / 2 - p.face * 10, y: p.y + p.h - 12 + (Math.random() - 0.5) * 12,
              vx: -p.face * 20, vy: k === 'bubbles' ? -35 : -12, life: 0.7, max: 0.7, hue: Math.round(time * 240) % 360});
}
// 공룡 등뿔·꼬리(몸 뒤에 그려요)
function drawDinoBack(cx, by, f, hc) {
  ctx.fillStyle = '#ff9f43'; ctx.strokeStyle = '#a8561a'; ctx.lineWidth = 1.5;
  for (let k = 0; k < 4; k++) {
    const a = -Math.PI / 2 - f * (0.25 + k * 0.42), bx = cx + Math.cos(a) * 12, byy = by + Math.sin(a) * 11;
    const nx = Math.cos(a) * 7, ny = Math.sin(a) * 7;
    ctx.beginPath(); ctx.moveTo(bx - ny * 0.55, byy + nx * 0.55); ctx.lineTo(bx + nx, byy + ny); ctx.lineTo(bx + ny * 0.55, byy - nx * 0.55); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = hc.body; ctx.strokeStyle = hc.dark; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - f * 9, by + 2); ctx.quadraticCurveTo(cx - f * 22, by + 6, cx - f * 24, by + 12); ctx.lineTo(cx - f * 8, by + 10); ctx.closePath(); ctx.fill(); ctx.stroke();
}
function drawHat(id, cx, by, f, hc) {
  const top = by - 12, ink = '#3b2b1c';
  ctx.lineWidth = 2; ctx.strokeStyle = ink;
  if (id === 'cap') {
    ctx.fillStyle = '#ff5c5c'; ctx.beginPath(); ctx.arc(cx, top + 5, 11, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ell(cx + f * 11, top + 5, 8, 2.6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ell(cx, top - 6, 2.4, 2.4); ctx.fill();
  } else if (id === 'flower') {
    for (const [dx, col] of [[-8, '#ff8fb1'], [0, '#ffd23f'], [8, '#b388ff']]) {
      ctx.fillStyle = col; for (let k = 0; k < 5; k++) { const a = k * 1.2566; ell(cx + dx + Math.cos(a) * 3, top + 1 + Math.sin(a) * 3, 2.4, 2.4); ctx.fill(); }
      ctx.fillStyle = '#fff8e7'; ell(cx + dx, top + 1, 1.6, 1.6); ctx.fill();
    }
  } else if (id === 'cat') {
    for (const s of [-1, 1]) {
      ctx.fillStyle = hc.body; ctx.strokeStyle = hc.dark;
      ctx.beginPath(); ctx.moveTo(cx + s * 3, top + 2); ctx.lineTo(cx + s * 10, top - 9); ctx.lineTo(cx + s * 12, top + 5); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff8fa8'; ctx.beginPath(); ctx.moveTo(cx + s * 6, top + 2); ctx.lineTo(cx + s * 9.5, top - 4); ctx.lineTo(cx + s * 10.5, top + 3); ctx.closePath(); ctx.fill();
    }
  } else if (id === 'bunny') {
    for (const s of [-1, 1]) {
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = ink; ell(cx + s * 5, top - 9, 3.6, 10, s * 0.18); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffb3c6'; ell(cx + s * 5, top - 8, 1.6, 6.5, s * 0.18); ctx.fill();
    }
  } else if (id === 'party') {
    ctx.fillStyle = '#4aa8ff'; ctx.beginPath(); ctx.moveTo(cx - 9, top + 4); ctx.lineTo(cx + 1, top - 20); ctx.lineTo(cx + 9, top + 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(cx - 5, top - 4); ctx.lineTo(cx + 6, top - 4); ctx.lineTo(cx + 4.5, top - 9); ctx.lineTo(cx - 2.5, top - 9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff6b8a'; ell(cx + 1, top - 21, 3.5, 3.5); ctx.fill(); ctx.stroke();
  } else if (id === 'pirate') {
    ctx.fillStyle = '#2b2140'; ctx.beginPath(); ctx.moveTo(cx - 15, top + 4); ctx.quadraticCurveTo(cx, top - 16, cx + 15, top + 4); ctx.quadraticCurveTo(cx, top - 1, cx - 15, top + 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ell(cx, top - 3, 2.8, 2.4); ctx.fill(); ctx.fillRect(cx - 3, top - 0.5, 6, 1.4);
  } else if (id === 'wizard') {
    ctx.fillStyle = '#7a52c8'; ctx.beginPath(); ctx.moveTo(cx - 9, top + 3); ctx.quadraticCurveTo(cx - 2, top - 14, cx - f * 8, top - 24); ctx.quadraticCurveTo(cx + 4, top - 10, cx + 9, top + 3); ctx.closePath(); ctx.fill(); ctx.stroke();
    ell(cx, top + 3, 15, 3.5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd23f'; starPath(cx + 1, top - 7, 3.4, 1.5); ctx.fill(); starPath(cx - 3, top - 14, 2, 0.9); ctx.fill();
  }
}
// 가게 미리보기: 다른 캔버스에 같은 콩콩이 그리기를 써요(그리는 동안만 ctx·p를 바꿔요)
// base = 그 칸의 기본 색(SLOT_INFO[i]) — 처음 화면은 칸마다 다른 색이라 직접 넘겨요(선택 칸은 안 바꿔요)
function drawPreview(c, wear, walk, base) {
  const g = c.getContext('2d'), s = c.height / 60, keep = {ctx, p, heroWear, heroBase};
  g.imageSmoothingEnabled = false;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height); g.setTransform(s, 0, 0, s, 0, 0);
  const cxp = c.width / s / 2 + 3;
  try {
    ctx = g; heroWear = wear; heroBase = base || null;
    p = {x: cxp - 11, y: 55 - 28, w: 22, h: 28, face: 1, inv: 0, ground: true, vx: walk ? 120 : 0, walk: walk || 0, power: null, shield: false};
    if (wear.trail !== 'none') for (let k = 0; k < 4; k++) drawTrail(wear.trail, cxp - 15 - k * 6, 48 - (k % 2) * 6, 1 - k * 0.2, (k * 70 + time * 120) % 360);
    drawHero();
  } finally { ctx = keep.ctx; p = keep.p; heroWear = keep.heroWear; heroBase = keep.heroBase; }
}

function drawHero() {
  if (p.inv > 0 && mode === 'play' && Math.floor(p.inv * 12) % 2 === 0) return;
  const cx = p.x + p.w / 2, by = p.y + p.h, f = p.face, hc = heroColors(), hat = wearOf().hat;
  if (p.power === 'speed' && Math.abs(p.vx) > 100) {
    for (let i = 1; i <= 3; i++) { ctx.globalAlpha = 0.25 / i; ctx.fillStyle = '#ffe066'; ell(cx - f * i * 9, by - 15, 13, 12); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  ctx.save();
  if (p.power === 'big') { ctx.translate(cx, by); ctx.scale(1.4, 1.4); ctx.translate(-cx, -by); }
  const moving = p.ground && Math.abs(p.vx) > 20, ph = moving ? Math.sin(p.walk * 6) : 0;
  const air = !p.ground, img = heroImg(hc);
  // 도트 그림: 걸을 땐 통통 뛰며 찌그러지고, 올라갈 땐 길쭉·내려올 땐 살짝 길쭉(그림만, 판정은 그대로)
  let sx = 1, sy = 1, lift = Math.abs(ph) * 1.5;
  if (img) {
    if (air) { const k = Math.min(1, Math.abs(p.vy) / 600); sx = 1 - k * 0.07; sy = 1 + k * 0.09; lift = 0; }
    else { sx = 1 + Math.abs(ph) * 0.05; sy = 1 - Math.abs(ph) * 0.06; lift = Math.abs(ph) * 2.5; }
  }
  // 새싹·모자 기준: 그림 머리 꼭대기(발에서 27칸 위)가 예전 몸 위끝(bodyY-12)과 같게. 그림 머리는 몸 가운데보다 3칸 뒤쪽
  const bodyY = img ? by - lift - 27 * sy + 12 : by - 15 - (air ? 2 : 0) - Math.abs(ph) * 1.5;
  const hx = img ? cx - f * 3 : cx;
  if (p.shield) {
    ctx.globalAlpha = 0.3 + 0.15 * Math.sin(time * 6); ctx.fillStyle = '#ffe066';
    ell(cx, img ? by - lift - 14 : bodyY, 22, 22); ctx.fill(); ctx.globalAlpha = 1;
  }
  if (hat === 'dino') drawDinoBack(hx, bodyY, f, hc);
  if (img) {
    drawSpr('hero', cx, by - lift, f, sx, sy, img);
    drawHeroTop(hx, bodyY, f, hc, hat);
    if (p.power === 'boom' && !boomOut) { ctx.save(); ctx.translate(cx - f * 12, by - lift - 13); ctx.rotate(-f * 0.6); drawBoomShape(0, 0, 0.7); ctx.restore(); }
    ctx.restore();
    return;
  }
  ctx.fillStyle = hc.dark;
  ell(cx - 6 + ph * 3, by - 2, 5, 3); ctx.fill(); ell(cx + 6 - ph * 3, by - 2, 5, 3); ctx.fill();
  ctx.fillStyle = hc.body; ctx.strokeStyle = hc.dark; ctx.lineWidth = 2;
  ell(cx, bodyY, 14, 13); ctx.fill(); ctx.stroke();
  ctx.fillStyle = hc.belly; ell(cx + f * 2, bodyY + 5, 8, 5); ctx.fill();
  const ex = cx + f * 3;
  ctx.fillStyle = '#ffffff'; ell(ex - 5, bodyY - 3, 4, 5); ctx.fill(); ell(ex + 5, bodyY - 3, 4, 5); ctx.fill();
  ctx.fillStyle = '#1d1a14'; ell(ex - 5 + f * 1.5, bodyY - 2, 2.2, 3); ctx.fill(); ell(ex + 5 + f * 1.5, bodyY - 2, 2.2, 3); ctx.fill();
  ctx.fillStyle = '#ffffff'; ell(ex - 4 + f, bodyY - 4, 0.9, 0.9); ctx.fill(); ell(ex + 6 + f, bodyY - 4, 0.9, 0.9); ctx.fill();
  ctx.globalAlpha = 0.6; ctx.fillStyle = '#ff8fa8'; ell(ex - 10, bodyY + 3, 3, 2); ctx.fill(); ell(ex + 10, bodyY + 3, 3, 2); ctx.fill(); ctx.globalAlpha = 1;
  ctx.strokeStyle = hc.dark; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(ex, bodyY + 3, 3, 0.2, Math.PI - 0.2); ctx.stroke();
  drawHeroTop(cx, bodyY, f, hc, hat);
  if (p.power === 'boom' && !boomOut) { ctx.save(); ctx.translate(cx - f * 12, bodyY - 2); ctx.rotate(-f * 0.6); drawBoomShape(0, 0, 0.7); ctx.restore(); }

}
// 머리 위: 새싹 잎(보호막이면 금색 큰 잎, 머리를 덮는 모자면 안 그림) + 모자
function drawHeroTop(cx, bodyY, f, hc, hat) {
  if (!HAT_COVER.has(hat)) {
    ctx.strokeStyle = '#2f6e22'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, bodyY - 12); ctx.quadraticCurveTo(cx + 2, bodyY - 17, cx, bodyY - 20); ctx.stroke();
    const big = p.shield ? 1.4 : 1, wob = Math.sin(time * 5) * 0.15;
    ctx.fillStyle = p.shield ? '#ffd23f' : '#4caf3a';
    ell(cx - 5 * big, bodyY - 21, 6 * big, 3 * big, -0.5 + wob); ctx.fill();
    ell(cx + 5 * big, bodyY - 21, 6 * big, 3 * big, 0.5 - wob); ctx.fill();
  }
  if (hat !== 'none' && hat !== 'dino') drawHat(hat, cx, bodyY, f, hc);
}

function drawBoomShape(x, y, s) {
  ctx.fillStyle = '#ff9f43'; ctx.strokeStyle = '#b4601a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 10 * s, y + 6 * s); ctx.quadraticCurveTo(x, y - 12 * s, x + 10 * s, y + 6 * s);
  ctx.lineTo(x + 6 * s, y + 8 * s); ctx.quadraticCurveTo(x, y - 4 * s, x - 6 * s, y + 8 * s); ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawItemIcon(k, cx, cy) {
  if (k === 'boom') { drawBoomShape(cx, cy + 2, 1.2); return; }
  if (k === 'speed') {
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#c48a00'; ctx.lineWidth = 2;

function drawDoor(e, label, col) {
  const ink = '#3b2b1c', x = e.x, y = e.y;
  ctx.fillStyle = e.used ? '#9a8a75' : col; ctx.strokeStyle = ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 2, y + e.h); ctx.lineTo(x + 2, y + 14); ctx.arc(x + 16, y + 14, 14, Math.PI, 0); ctx.lineTo(x + 30, y + e.h); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffd23f'; ell(x + 24, y + 38, 2.5, 2.5); ctx.fill();
  if (!e.used) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(time * 5);
    ctx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 3 : 7, a = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(x + 16 + Math.cos(a) * r, y + 18 + Math.sin(a) * r); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;

  ctx.fillStyle = '#fff8e7'; ctx.font = '13px Jua, "Malgun Gothic", sans-serif'; ctx.textAlign = 'center';
  ctx.strokeStyle = ink; ctx.lineWidth = 3; ctx.strokeText(label, x + 16, y - 6); ctx.fillText(label, x + 16, y - 6);
}

function drawBoss(b) {
  const ink = '#3b2b1c', cx = b.x + b.w / 2, by = b.y + b.h, s = b.w / 26;
  if (b.dead) { ctx.globalAlpha = Math.max(0, b.sq); ctx.fillStyle = '#ffffff'; ell(cx, by - b.h / 2, b.w * 0.6 * (1.6 - b.sq), b.h * 0.5 * (1.6 - b.sq)); ctx.fill(); ctx.globalAlpha = 1; return; }
  if (b.kind === 'octo') { drawOcto(b, cx, by); return; }
  if (b.kind === 'bee' && b.active && b.st !== 'rest') {
    const warn = b.st === 'warn' || b.st === 'dive';
    ctx.globalAlpha = warn ? 0.45 + 0.25 * Math.sin(time * 20) : 0.18; ctx.fillStyle = warn ? '#d8434f' : '#000000';
    ell(cx, 10 * T - 3, b.w * 0.5, 6); ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.save();
  if (b.inv > 0 && Math.floor(b.inv * 12) % 2 === 0) ctx.globalAlpha = 0.35;
  let ox = 0; if (b.st === 'shake' || b.st === 'warn') ox = Math.sin(time * 60) * 2.5;
  ctx.translate(cx + ox, by);
  const crouch = b.st === 'crouch' ? 0.82 : 1;
  ctx.scale(s, s * crouch);
  if (b.kind === 'snail' && b.st === 'hide') {
    ctx.fillStyle = '#ff9f43'; ctx.strokeStyle = '#c4681b'; ctx.lineWidth = 2 / s * 1.5;
    ell(0, -11, 11, 11); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(0, -11, 6, 0, 4.6); ctx.stroke();
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 12); ctx.fillStyle = '#ffffff'; ell(-4, -16, 2, 2); ctx.fill();
  } else {
    const fake = b.kind === 'snail' ? {t:'snail', x:-14, y:-22, w:28, h:22, vx:b.face}
      : b.kind === 'bee' ? {t:'bee', x:-13, y:-22, w:26, h:22, face:b.face}
      : {t:'frog', x:-13, y:-22, w:26, h:22, ground:b.ground, face:b.face};
    drawEnt(fake);
    if (b.kind === 'frog' && b.st === 'crouch') { ctx.fillStyle = '#ff9fb8'; ell(b.face * 8, -9, 5, 4); ctx.fill(); }
  }
  // 왕관
  const top = b.kind === 'bee' ? -24 : b.kind === 'frog' ? -27 : -25;
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = ink; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-6, top); ctx.lineTo(-6, top - 5); ctx.lineTo(-3, top - 2.5); ctx.lineTo(0, top - 6); ctx.lineTo(3, top - 2.5); ctx.lineTo(6, top - 5); ctx.lineTo(6, top); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  // 예고(!)와 헉헉(밟을 틈)
  const warnNow = b.st === 'shake' || b.st === 'warn' || b.st === 'crouch';
  const restNow = b.st === 'rest' || b.st === 'land' || b.st === 'tired';
  if (warnNow || restNow) {
    ctx.font = '20px Jua, "Malgun Gothic", sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = ink;
    const t = warnNow ? '!' : '헉헉', yy = b.y - 14 + Math.sin(time * 8) * 2;
    ctx.fillStyle = warnNow ? '#ff5a5a' : '#ffffff'; ctx.strokeText(t, cx, yy); ctx.fillText(t, cx, yy);
  }
}

function drawOcto(b, cx, by) {
  const ink = '#3b2b1c', weak = b.st === 'weak';
  // 그림자: 내려올 자리(빨갛게 깜빡이면 곧 내려와요)
  if (b.active && !weak) {
    const warn = b.st === 'down' || b.st === 'tAtk' || b.st === 'iAfter';
    ctx.globalAlpha = warn ? 0.4 + 0.25 * Math.sin(time * 20) : 0.18; ctx.fillStyle = warn ? '#d8434f' : '#000000';
    ell(cx, 10 * T - 3, b.w * 0.5, 6); ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.save();
  if (b.inv > 0 && Math.floor(b.inv * 12) % 2 === 0) ctx.globalAlpha = 0.35;
  const ox = b.st === 'iWarn' ? Math.sin(time * 60) * 2.5 : 0, hy = b.y + 26;
  // 다리 6개(헉헉일 땐 축 늘어져요)
  ctx.strokeStyle = '#a8326a'; ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const lx = cx + ox - 30 + i * 12, sw = weak ? 2 : Math.sin(time * 4 + i) * 7;
    ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(lx, hy + 14);
    ctx.quadraticCurveTo(lx + sw, hy + 30, lx + sw * 1.6 + (i < 3 ? -6 : 6), weak ? by + 2 : hy + 44); ctx.stroke();
  }
  ctx.lineCap = 'butt';
  if (sprOk('octo')) {
    // 도트 그림 머리(왕관 포함): 머리 가운데를 예전 머리 가운데(hy)에. 헉헉일 땐 눈 위에 X
    const m = SPR_META.octo, im = SPR.octo.img, hx = cx + ox;
    drawSpr('octo', hx, hy + (im.height - m.cy) * m.s, 0, 1, weak ? 0.94 : 1 + 0.02 * Math.sin(time * 3));
    if (weak) {
      ctx.lineWidth = 3; ctx.strokeStyle = ink; ctx.lineCap = 'round';
      for (const ex of [hx - 17, hx + 16]) { const ey = hy + 7; ctx.fillStyle = '#ffffff'; ell(ex, ey, 6, 6); ctx.fill(); ctx.beginPath(); ctx.moveTo(ex - 4, ey - 4); ctx.lineTo(ex + 4, ey + 4); ctx.moveTo(ex + 4, ey - 4); ctx.lineTo(ex - 4, ey + 4); ctx.stroke(); }
      ctx.lineCap = 'butt';
    }
  } else {
  // 머리
  ctx.fillStyle = '#e8579a'; ctx.strokeStyle = ink; ctx.lineWidth = 2.5;
  ell(cx + ox, hy, b.w / 2, 28); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff9cc6'; for (const [dx, dy, r] of [[-20, -10, 5], [14, -14, 4], [22, 2, 3.5], [-6, -18, 3]]) { ell(cx + ox + dx, hy + dy, r, r); ctx.fill(); }
  // 눈과 입
  const f = b.face || -1, ey = hy + 4;
  ctx.fillStyle = '#ffffff'; ell(cx + ox - 12 + f * 3, ey, 8, 9); ctx.fill(); ctx.stroke(); ell(cx + ox + 12 + f * 3, ey, 8, 9); ctx.fill(); ctx.stroke();
  ctx.fillStyle = ink;
  if (weak) { ctx.lineWidth = 2; for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(cx + ox + s * 12 - 5 + f * 3, ey - 3); ctx.lineTo(cx + ox + s * 12 + 5 + f * 3, ey + 3); ctx.moveTo(cx + ox + s * 12 + 5 + f * 3, ey - 3); ctx.lineTo(cx + ox + s * 12 - 5 + f * 3, ey + 3); ctx.stroke(); } }
  else { ell(cx + ox - 12 + f * 6, ey + 1, 3.5, 4.5); ctx.fill(); ell(cx + ox + 12 + f * 6, ey + 1, 3.5, 4.5); ctx.fill(); }
  ctx.fillStyle = '#a8326a'; ell(cx + ox + f * 4, hy + 18, b.st === 'iWarn' ? 7 : 4, b.st === 'iWarn' ? 6 : 3); ctx.fill();
  // 왕관
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = ink; ctx.lineWidth = 1.5; const ty = hy - 26;
  ctx.beginPath(); ctx.moveTo(cx + ox - 14, ty); ctx.lineTo(cx + ox - 14, ty - 12); ctx.lineTo(cx + ox - 7, ty - 5); ctx.lineTo(cx + ox, ty - 14); ctx.lineTo(cx + ox + 7, ty - 5); ctx.lineTo(cx + ox + 14, ty - 12); ctx.lineTo(cx + ox + 14, ty); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();

  }
}

function drawBossBar() {

function drawEnt(e) {
  const ink = '#3b2b1c';
  switch (e.t) {
    case 'candy': {
      const cx = e.x + 9, cy = e.y + 9 + Math.sin(time * 3 + e.ph) * 2;
      ctx.fillStyle = '#ffb3c7';
      ctx.beginPath(); ctx.moveTo(cx - 6, cy); ctx.lineTo(cx - 12, cy - 5); ctx.lineTo(cx - 12, cy + 5); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx + 6, cy); ctx.lineTo(cx + 12, cy - 5); ctx.lineTo(cx + 12, cy + 5); ctx.fill();
      ctx.fillStyle = '#ff6b8a'; ell(cx, cy, 7, 7); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, 4.5); ctx.stroke();
      break;
    }
    case 'star': {
      const cx = e.x + 13, cy = e.y + 13 + Math.sin(time * 2.5 + e.ph) * 3;
      ctx.globalAlpha = 0.3 + 0.2 * Math.sin(time * 4); ctx.fillStyle = '#fff3a0'; ell(cx, cy, 20, 20); ctx.fill(); ctx.globalAlpha = 1;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) { const r = i % 2 ? 6.5 : 15, a = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
      ctx.closePath(); ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.strokeStyle = '#c48a00'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = ink; ell(cx - 3, cy - 1, 1.4, 2); ctx.fill(); ell(cx + 3, cy - 1, 1.4, 2); ctx.fill();
      ctx.lineWidth = 1.3; ctx.strokeStyle = ink; ctx.beginPath(); ctx.arc(cx, cy + 2, 2.2, 0.2, Math.PI - 0.2); ctx.stroke();
      break;
    }
    case 'snail': {
      const cx = e.x + e.w / 2, by = e.y + e.h, f = e.vx > 0 ? 1 : -1;
      if (sprOk('snail')) { sprDeadOr(e, 'snail', cx, by, f, 1, 1 + 0.04 * Math.sin(time * 6 + e.x)); break; }
      if (e.dead) {
        ctx.globalAlpha = Math.max(0, e.sq * 2); ctx.fillStyle = '#ff9f43'; ell(cx, by - 4, 15, 4); ctx.fill(); ctx.globalAlpha = 1; break;
      }
      ctx.lineWidth = 2; ctx.strokeStyle = '#8a5a2b';
      ctx.fillStyle = '#ffe3a3'; rr(e.x, by - 8, e.w, 8, 4); ctx.fill(); ctx.stroke();
      ell(cx + f * 11, by - 10, 6, 6); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + f * 11, by - 14); ctx.lineTo(cx + f * 10, by - 22); ctx.moveTo(cx + f * 14, by - 14); ctx.lineTo(cx + f * 17, by - 21); ctx.stroke();
      ctx.fillStyle = ink; ell(cx + f * 10, by - 22, 2, 2); ctx.fill(); ell(cx + f * 17, by - 21, 2, 2); ctx.fill();
      ctx.fillStyle = '#ff9f43'; ell(cx - f * 3, by - 13, 10, 10); ctx.fill(); ctx.strokeStyle = '#c4681b'; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx - f * 3, by - 13, 6, 0, 4.6); ctx.stroke(); ctx.beginPath(); ctx.arc(cx - f * 3, by - 13, 2.5, 0, 4.6); ctx.stroke();
      break;
    }
    case 'bee': {
      const cx = e.x + e.w / 2, cy = e.y + e.h / 2, f = e.face || (p.x < e.x ? -1 : 1);
      ctx.save();
      if (e.dead) { ctx.translate(cx, cy); ctx.rotate(Math.PI); ctx.translate(-cx, -cy); }
      if (sprOk('bee')) { drawSpr('bee', cx, cy + 14 + Math.sin(time * 9 + e.x) * 1, f, 1, 1 + 0.04 * Math.sin(time * 40)); ctx.restore(); break; }
      ctx.globalAlpha = 0.75; ctx.fillStyle = '#ffffff';
      const flap = e.dead ? 3 : 4 + 2 * Math.sin(time * 40);
      ell(cx - 4, cy - 10, 6, flap, -0.3); ctx.fill(); ell(cx + 4, cy - 11, 6, flap, 0.3); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = ink; ctx.beginPath(); ctx.moveTo(cx - f * 12, cy); ctx.lineTo(cx - f * 18, cy + 2); ctx.lineTo(cx - f * 12, cy + 4); ctx.fill();
      ctx.fillStyle = '#ffd23f'; ell(cx, cy, 13, 10); ctx.fill();
      ctx.save(); ell(cx, cy, 13, 10); ctx.clip(); ctx.fillStyle = ink; ctx.fillRect(cx - 5, cy - 12, 3.5, 24); ctx.fillRect(cx + 2, cy - 12, 3.5, 24); ctx.restore();
      ctx.strokeStyle = '#5a3b12'; ctx.lineWidth = 2; ell(cx, cy, 13, 10); ctx.stroke();
      ctx.fillStyle = ink; ell(cx + f * 8, cy - 2, 2.2, 2.6); ctx.fill();
      ctx.restore();
      break;
    }
    case 'frog': {
      const cx = e.x + e.w / 2, by = e.y + e.h, f = e.face || -1;
      if (sprOk('frog')) { sprDeadOr(e, 'frog', cx, by, f, e.ground ? 1 : 0.92, e.ground ? 1 : 1.1); break; }
      if (e.dead) { ctx.globalAlpha = Math.max(0, e.sq * 2); ctx.fillStyle = '#4fb3d9'; ell(cx, by - 4, 15, 4); ctx.fill(); ctx.globalAlpha = 1; break; }
      ctx.lineWidth = 2; ctx.strokeStyle = '#1f5f7a'; ctx.fillStyle = '#3a9cc4';
      if (!e.ground) { ell(cx - f * 10, by - 3, 9, 3, f * 0.5); ctx.fill(); ell(cx + f * 5, by - 2, 6, 3); ctx.fill(); }
      else { ell(cx - 9, by - 3, 7, 4); ctx.fill(); ell(cx + 9, by - 3, 7, 4); ctx.fill(); }
      ctx.fillStyle = '#4fb3d9'; ell(cx, by - 10, 13, 10); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#bfe9f7'; ell(cx + f * 3, by - 7, 7, 5); ctx.fill();
      ctx.fillStyle = '#4fb3d9'; ell(cx - 6, by - 20, 5, 5); ctx.fill(); ctx.stroke(); ell(cx + 6, by - 20, 5, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ell(cx - 6, by - 20, 3, 3); ctx.fill(); ell(cx + 6, by - 20, 3, 3); ctx.fill();
      ctx.fillStyle = '#1d1a14'; ell(cx - 6 + f, by - 20, 1.6, 1.8); ctx.fill(); ell(cx + 6 + f, by - 20, 1.6, 1.8); ctx.fill();
      ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx + f * 2, by - 11, 5, 0.3, Math.PI - 0.3); ctx.stroke();
      break;
    }
    case 'spike': {
      const by = e.y + e.h;
      ctx.fillStyle = '#dfe6f2'; ctx.strokeStyle = ink; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) { const sx = e.x + 2 + i * 9.5; ctx.beginPath(); ctx.moveTo(sx, by); ctx.lineTo(sx + 4.75, by - 15); ctx.lineTo(sx + 9.5, by); ctx.closePath(); ctx.fill(); ctx.stroke(); }
      ctx.fillStyle = '#ffffff'; for (let i = 0; i < 3; i++) { ell(e.x + 6.5 + i * 9.5, by - 7, 1, 2); ctx.fill(); }
      break;
    }
    case 'spring': {
      const by = e.y + e.h, hg = e.h * (1 - e.sq * 0.45);
      ctx.strokeStyle = '#7a7a8c'; ctx.lineWidth = 3; ctx.beginPath();
      const steps = 4;
      for (let i = 0; i <= steps; i++) { const yy = by - 3 - (hg - 8) * (i / steps); ctx.lineTo(e.x + (i % 2 ? 4 : e.w - 4), yy); }
      ctx.stroke();
      ctx.fillStyle = '#555566'; rr(e.x + 2, by - 4, e.w - 4, 4, 2); ctx.fill();
      ctx.fillStyle = '#ff5a5a'; ctx.strokeStyle = ink; ctx.lineWidth = 2; rr(e.x, by - hg, e.w, 7, 3); ctx.fill(); ctx.stroke();
      break;
    }
    case 'check': {
      const px = e.col * T + 14, by = (e.row + 1) * T;
      ctx.fillStyle = '#8a6a4a'; ctx.fillRect(px, by - 3 * T, 4, 3 * T);
      ctx.fillStyle = e.on ? '#ff6b8a' : '#e9e2d0'; ctx.strokeStyle = ink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px + 4, by - 3 * T + 2); ctx.lineTo(px + 30, by - 3 * T + 12); ctx.lineTo(px + 4, by - 3 * T + 22); ctx.closePath(); ctx.fill(); ctx.stroke();
      if (e.on) { ctx.fillStyle = '#4caf3a'; ell(px + 12, by - 3 * T + 12, 4, 2, -0.5); ctx.fill(); }
      ctx.fillStyle = '#ffd23f'; ell(px + 2, by - 3 * T - 2, 4, 4); ctx.fill();
      break;
    }
    case 'goal': {
      const px = e.col * T + 14, by = (e.row + 1) * T, top = by - 7 * T;
      if (lv.home) drawHouse(px + 40, by);
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = ink; ctx.lineWidth = 2;
      ctx.fillRect(px, top, 5, 7 * T); ctx.strokeRect(px, top, 5, 7 * T);
      ctx.fillStyle = '#ffd23f'; ell(px + 2.5, top - 6, 7, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#5cbf4a'; ctx.beginPath(); ctx.moveTo(px + 5, top + 6);
      for (let i = 0; i <= 8; i++) ctx.lineTo(px + 5 + i * 6, top + 6 + Math.sin(time * 5 + i * 0.8) * 3);
      for (let i = 8; i >= 0; i--) ctx.lineTo(px + 5 + i * 6, top + 38 + Math.sin(time * 5 + i * 0.8) * 3);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ell(px + 29, top + 22 + Math.sin(time * 5 + 3) * 3, 6, 6); ctx.fill();
      ctx.fillStyle = '#c9a77c'; rr(px - 8, by - 10, 21, 10, 3); ctx.fill(); ctx.stroke();
      break;
    }
    case 'sign': {
      const px = e.x, py = e.y;
      ctx.fillStyle = '#8a5a2b'; ctx.fillRect(px + 14, py + 14, 4, 18);
      ctx.fillStyle = '#d9a066'; ctx.strokeStyle = ink; ctx.lineWidth = 2; rr(px + 3, py + 2, 26, 16, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = ink; ctx.font = '13px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('!', px + 16, py + 15);
      break;
    }
    case 'crab': {
      const cx = e.x + e.w / 2, by = e.y + e.h, wob = Math.sin(time * 14 + e.x) * 1.5;
      if (sprOk('crab')) { sprDeadOr(e, 'crab', cx, by - Math.abs(wob) * 0.6, 1, 1, 1); break; }
      if (e.dead) { ctx.globalAlpha = Math.max(0, e.sq * 2); ctx.fillStyle = '#ff6b5a'; ell(cx, by - 4, 15, 4); ctx.fill(); ctx.globalAlpha = 1; break; }
      ctx.strokeStyle = '#a8322a'; ctx.lineWidth = 2;
      for (const s of [-1, 1]) for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(cx + s * 6, by - 6); ctx.lineTo(cx + s * (12 + i * 2), by - 1 + (i % 2) * wob); ctx.stroke(); }
      ctx.fillStyle = '#ff6b5a'; ell(cx, by - 9, 13, 8); ctx.fill(); ctx.stroke();
      for (const s of [-1, 1]) { ell(cx + s * 15, by - 15 + (s > 0 ? wob : -wob), 5, 4); ctx.fill(); ctx.stroke(); }
      ctx.fillStyle = '#ffffff'; ell(cx - 4, by - 18, 3, 3); ctx.fill(); ell(cx + 4, by - 18, 3, 3); ctx.fill();
      ctx.fillStyle = ink; ell(cx - 4, by - 18, 1.5, 1.8); ctx.fill(); ell(cx + 4, by - 18, 1.5, 1.8); ctx.fill();
      break;
    }
    case 'jelly': {
      const cx = e.x + e.w / 2, ty = e.y + 2;
      ctx.save(); if (e.dead) ctx.globalAlpha = 0.5;
      if (sprOk('jelly')) { drawSpr('jelly', cx, e.y + e.h + 1, 0, 1 - 0.04 * Math.sin(time * 5), 1 + 0.05 * Math.sin(time * 5)); ctx.restore(); break; }
      ctx.strokeStyle = '#c86fd6'; ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) { const x = cx - 8 + i * 5.3; ctx.beginPath(); ctx.moveTo(x, ty + 12); ctx.quadraticCurveTo(x + Math.sin(time * 5 + i) * 4, ty + 20, x, ty + 27); ctx.stroke(); }
      ctx.fillStyle = 'rgba(240,160,255,.9)'; ctx.beginPath(); ctx.ellipse(cx, ty + 12, 12, 11, 0, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = ink; ell(cx - 4, ty + 7, 1.5, 2); ctx.fill(); ell(cx + 4, ty + 7, 1.5, 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.globalAlpha *= 0.7; ell(cx - 6, ty + 3, 3, 2); ctx.fill();
      ctx.restore();
      break;
    }
    case 'shark': {
      const cx = e.x + e.w / 2, cy = e.y + e.h / 2, f = e.vx > 0 ? 1 : -1;
      ctx.save(); if (e.dead) { ctx.translate(cx, cy); ctx.rotate(Math.PI); ctx.translate(-cx, -cy); }
      if (sprOk('shark')) { drawSpr('shark', cx, cy + 13, f, 1, 1); ctx.restore(); break; }
      ctx.fillStyle = '#7f95a8'; ctx.strokeStyle = '#3e5366'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx - f * 22, cy); ctx.lineTo(cx - f * 31, cy - 9); ctx.lineTo(cx - f * 29, cy + 9); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - f * 4, cy - 9); ctx.lineTo(cx - f * 10, cy - 19); ctx.lineTo(cx + f * 6, cy - 9); ctx.closePath(); ctx.fill(); ctx.stroke();
      ell(cx, cy, 24, 11); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e6eef4'; ell(cx + f * 4, cy + 5, 16, 5); ctx.fill();
      ctx.fillStyle = ink; ell(cx + f * 14, cy - 3, 2.2, 2.6); ctx.fill();
      ctx.strokeStyle = ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx + f * 9, cy + 4); ctx.lineTo(cx + f * 20, cy + 3); ctx.stroke();
      ctx.restore();
      break;
    }
    case 'cloud': {
      if (e.turtle) {
        const f = e.vx > 0 ? 1 : -1, cx = e.x + e.w / 2, top = e.y;
        if (sprOk('turtle')) {
          // 등껍데기 윗선(그림 맨 위)이 탈 자리(e.y)와 같게
          drawSpr('turtle', cx, top - 1 + SPR.turtle.img.height * SPR_META.turtle.s, f);
          if (e.pause > 0) { ctx.fillStyle = '#fff8e7'; ctx.font = '12px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('타요!', cx, top - 8); }
          break;
        }
        ctx.fillStyle = '#7cc46a'; ctx.strokeStyle = '#2f6e22'; ctx.lineWidth = 2;
        ell(cx + f * (e.w / 2 + 6), top + 12, 9, 7); ctx.fill(); ctx.stroke();
        ctx.fillStyle = ink; ell(cx + f * (e.w / 2 + 9), top + 10, 1.6, 2); ctx.fill();
        ctx.fillStyle = '#7cc46a';
        for (const s of [-1, 1]) { ell(cx + s * (e.w / 2 - 10), top + 18, 8, 4, s * 0.4 + Math.sin(time * 6) * 0.3); ctx.fill(); ctx.stroke(); }
        ctx.fillStyle = '#3f8f4a'; ctx.beginPath(); ctx.ellipse(cx, top + 12, e.w / 2, 13, 0, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = '#9fd88a'; ctx.lineWidth = 2;
        for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(cx + i * 22, top + 6, 7, 0, Math.PI * 2); ctx.stroke(); }
        if (e.pause > 0) { ctx.fillStyle = '#fff8e7'; ctx.font = '12px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('타요!', cx, top - 8); }
        break;
      }
      ctx.fillStyle = '#d6ecfb'; rr(e.x, e.y + 5, e.w, 11, 6); ctx.fill();
      ctx.fillStyle = '#ffffff'; rr(e.x, e.y, e.w, 11, 6); ctx.fill();
      for (let i = 0; i < e.w / 16; i++) { ell(e.x + 8 + i * 16, e.y + 1, 9, 6); ctx.fill(); }
      ctx.fillStyle = '#7fb6e0'; ell(e.x + e.w / 2 - 6, e.y + 7, 1.5, 2); ctx.fill(); ell(e.x + e.w / 2 + 6, e.y + 7, 1.5, 2); ctx.fill();
      break;
    }
    case 'boss': drawBoss(e); break;
    case 'door': drawDoor(e, '비밀의 방', '#8a5cc8'); break;
    case 'exit': drawDoor(e, '나가기', '#5cbf4a'); break;
    case 'item': {
      const cx = e.x + 16, cy = e.y + 16 + Math.sin(time * 3 + e.x) * 3, mine = p.power === e.k;
      ctx.globalAlpha = 0.35 + 0.2 * Math.sin(time * 4); ctx.fillStyle = mine ? '#ffd23f' : '#ffffff'; ell(cx, cy, 22, 22); ctx.fill(); ctx.globalAlpha = 1;
      if (mine) { ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3; ell(cx, cy, 22, 22); ctx.stroke(); }
      drawItemIcon(e.k, cx, cy);
      ctx.font = '14px Jua, "Malgun Gothic", sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = '#3b2b1c';
      const lab = mine ? '골랐어요!' : POWERS[e.k];
      ctx.fillStyle = mine ? '#ffd23f' : '#ffffff'; ctx.strokeText(lab, cx, e.y + 60); ctx.fillText(lab, cx, e.y + 60);
      ctx.fillStyle = '#d9b24a'; rr(e.x + 4, 9 * T + 22, T - 8, 10, 3); ctx.fill();
      break;
    }
    case 'boom': { ctx.save(); ctx.translate(e.x + 10, e.y + 10); ctx.rotate(time * 18); drawBoomShape(0, 0, 1); ctx.restore(); break; }
    case 'wave': {
      ctx.fillStyle = '#9be7ff'; ctx.strokeStyle = '#1f5f9a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(e.x, e.y + e.h); ctx.quadraticCurveTo(e.x + e.w / 2, e.y - 6, e.x + e.w, e.y + e.h); ctx.closePath(); ctx.fill(); ctx.stroke();
      break;
    }
    case 'tent': {
      const cx = e.x + e.w / 2;
      if (e.st === 'warn') {
        // 예고: 바닥에서 거품과 빨간 표시가 깜빡여요
        ctx.globalAlpha = 0.45 + 0.35 * Math.sin(time * 18); ctx.fillStyle = '#ff5a5a'; ell(cx, e.base - 3, 18, 6); ctx.fill(); ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(255,255,255,.8)'; for (let i = 0; i < 3; i++) { ell(cx - 8 + i * 8, e.base - 8 - ((time * 40 + i * 9) % 18), 2.5, 2.5); ctx.fill(); }
        break;
      }
      ctx.fillStyle = '#e8579a'; ctx.strokeStyle = '#3b2b1c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(e.x, e.base); ctx.quadraticCurveTo(e.x - 2, e.y + e.h * 0.4, cx, e.y); ctx.quadraticCurveTo(e.x + e.w + 2, e.y + e.h * 0.4, e.x + e.w, e.base); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffc2dc'; for (let yy = e.y + 14; yy < e.base - 6; yy += 14) { ell(cx + 4, yy, 3, 3); ctx.fill(); }
      break;
    }
    case 'ink': {
      const cx = e.x + 10, cy = e.y + 11;
      ctx.fillStyle = '#2a2140'; ell(cx, cy, 10, 9); ctx.fill(); ell(cx - Math.sign(e.vx) * 9, cy + 2, 6, 5); ctx.fill();
      ctx.fillStyle = '#ffffff'; ell(cx + Math.sign(e.vx) * 3, cy - 2, 2.2, 2.2); ctx.fill();
      break;
    }
    case 'sprout': {
      const cx = e.x + 11, by = e.y + 22;
      ctx.save(); if (e.emerge > 0) { ctx.beginPath(); ctx.rect(e.x - 4, e.top - 10, 30, 32 + 10); ctx.clip(); }
      ctx.fillStyle = '#fff1d6'; ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 2; rr(cx - 8, by - 9, 16, 9, 3); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#2f6e22'; ctx.beginPath(); ctx.moveTo(cx, by - 9); ctx.lineTo(cx, by - 15); ctx.stroke();
      ctx.fillStyle = '#5cbf4a'; ell(cx - 6, by - 17, 7, 4, -0.5); ctx.fill(); ell(cx + 6, by - 17, 7, 4, 0.5); ctx.fill();
      ctx.restore();
      break;
    }
  }
}

function drawHouse(x, by) {
  const ink = '#3b2b1c';
  ctx.lineWidth = 2; ctx.strokeStyle = ink;
  ctx.fillStyle = '#fff1d6'; ctx.fillRect(x, by - 80, 110, 80); ctx.strokeRect(x, by - 80, 110, 80);
  ctx.fillStyle = '#ff6b8a'; ctx.beginPath(); ctx.moveTo(x - 14, by - 78); ctx.lineTo(x + 55, by - 130); ctx.lineTo(x + 124, by - 78); ctx.closePath(); ctx.fill(); ctx.stroke();

function render() {

  drawHero();
  for (const q of lv.waters || []) {

}

// ---------- 끝없는 길 ----------
// 덩어리(깃발 + 조각 6개)를 끝에 이어 붙여요. 조각은 모두 땅(높이 2)으로 시작해서 땅으로 끝나요.
// 거리가 늘수록 조각 종류·tier·적 속도가 올라가요(저장칸 난이도와 상관없이 같은 규칙, 하트 3)
const END_THEMES = ['meadow', 'flower', 'forest', 'beach', 'cave', 'sky', 'night'];
const END_SEGS = [
  [0, ['rest', 'snails', 'bees', 'bricks', 'spring', 'spikes', 'towers', 'gapChain', 'beeGap', 'ledgeSnail']],
  [150, ['frogs', 'tunnel', 'lowGap', 'spikeHop', 'liftBee', 'cloudHop', 'crabs', 'swim']],
  [400, ['jellyPool', 'coralPool']],
  [800, ['sharkPool', 'turtleRide', 'caveDive']],

const END_START = 8, END_MAX = 999999;

  const list = ['check'];
  for (let k = 0; k < 6; k++) {
    let s = pool[Math.floor(endRand() * pool.length)];
    if (s === E.last) s = pool[Math.floor(endRand() * pool.length)];
    if (s === 'cloudHop' || s === 'liftBee') list.push('rest'); // 움직이는 발판 앞엔 기다릴 평지

  if (E.segs.length > 300) E.segs.splice(0, E.segs.length - 300);

function startEndless() {

    const before = {wallet: sl.wallet, owned: sl.owned.slice(), wear: Object.assign({}, sl.wear)};
    sl.wallet -= item[2]; sl.owned.push(kind + ':' + id); sl.wear[kind] = id;

<script>
(() => {
  "use strict";
  try {
    if (!(isSecureContext && "serviceWorker" in navigator &&
        (location.hostname.endsWith("github.io") || location.hostname === "localhost" ||
         location.hostname === "127.0.0.1"))) return;

    const PREPARING = "오프라인 준비 중…";
    const UNAVAILABLE = "오프라인 준비 안 됨 — 인터넷 연결 후 다시 열어 주세요";
    let registration = null;
    let hadController = !!navigator.serviceWorker.controller;
    let lastUpdate = -Infinity;
    let applying = false;
    let checking = false;
    let reloading = false;
    const safe = () => !!(window.__kk && (window.__kk.mode === "title" || window.__kk.mode === "select"));

    function show(text) {
      try {
        // v6 처음 화면은 아래 저장칸 띠(.title-bot), 예전 판은 상자(.panel)
        const panel = document.querySelector("#scTitle .title-bot") || document.querySelector("#scTitle .panel");
        if (!panel) return;
        let state = document.getElementById("offlineState");
        if (!state) {
          state = document.createElement("div");
          state.id = "offlineState";
          state.style.fontSize = "13px";
          state.style.color = "#ffffff";
          state.style.textShadow = "0 1px 0 #3b2b1c, 0 0 3px #3b2b1c";
          state.setAttribute("role", "status");
          panel.appendChild(state);
        }
        state.textContent = text;
      } catch (_) {}
    }

    function message(worker, command) {
      return new Promise((resolve, reject) => {
        let channel;
        let timer;
        const finish = (error, data) => {
          clearTimeout(timer);
          if (channel) { channel.port1.close(); channel.port2.close(); }
          if (error) reject(error); else resolve(data);
        };
        try {
          if (!worker) throw new Error("서비스 워커 없음");
          channel = new MessageChannel();
          timer = setTimeout(() => finish(new Error("서비스 워커 응답 시간 초과")), 5000);
          channel.port1.onmessage = event => finish(null, event.data);
          channel.port1.onmessageerror = () => finish(new Error("서비스 워커 응답 오류"));
          worker.postMessage(command, [channel.port2]);
        } catch (error) { finish(error); }
      });
    }

    async function status() {
      if (checking) return;
      checking = true;
      try {
        const worker = navigator.serviceWorker.controller || (registration && registration.active);
        if (!worker) {
          show(!registration || registration.installing ? PREPARING : UNAVAILABLE);
          return;
        }
        const data = await message(worker, "status");
        if (worker !== (navigator.serviceWorker.controller || (registration && registration.active))) return;
        show(data.ready ? "오프라인 준비 완료 · v" + data.version.slice(0, 6) : UNAVAILABLE);
      } catch (_) { show(UNAVAILABLE); }
      finally { checking = false; }
    }

    async function applyWaiting() {
      if (applying || reloading || !registration || !registration.waiting || !safe()) return;
      applying = true;
      try {
        const worker = registration.waiting;
        const data = await message(worker, "status");
        if (data.ready && worker === registration.waiting && safe()) await message(worker, "apply");
      } catch (_) {}
      finally { applying = false; }
    }

    async function update() {
      try {
        // 인터넷이 없으면 확인하지 않아요(비행기 모드에서 콘솔 오류 방지)
        if (!registration || navigator.onLine === false || performance.now() - lastUpdate < 60000) return;
        lastUpdate = performance.now();
        await registration.update();
      } catch (_) {}
      finally { await status(); await applyWaiting(); }
    }

    async function controllerChanged() {
      const existed = hadController;
      hadController = !!navigator.serviceWorker.controller;
      try {
        const worker = navigator.serviceWorker.controller;
        if (existed && worker && safe() && !reloading) {
          const data = await message(worker, "status");
          if (data.ready && safe() && worker === navigator.serviceWorker.controller) {
            const key = "kongkong-reloaded-" + data.version;
            // If sessionStorage is unavailable, avoid an unbounded reload.
            if (!sessionStorage.getItem(key)) {
              sessionStorage.setItem(key, "1");
              reloading = true;
              location.reload();
              return;
            }
          }
        }
      } catch (_) {}
      await status();
      await applyWaiting();
    }

    async function start() {
      show(PREPARING);
      try {
        if (navigator.storage && navigator.storage.persist) {
          Promise.resolve(navigator.storage.persist()).catch(() => {});
        }
      } catch (_) {}
      try {
        navigator.serviceWorker.addEventListener("controllerchange", () => { controllerChanged().catch(() => {}); });
        registration = await navigator.serviceWorker.register("./sw.js", {scope: "./", updateViaCache: "none"});
        const watch = worker => {
          try {
            if (!worker) return;
            worker.addEventListener("statechange", () => {
              status().catch(() => {});
              applyWaiting().catch(() => {});
            });
          } catch (_) {}
        };
        registration.addEventListener("updatefound", () => { watch(registration.installing); });
        watch(registration.installing);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") update().catch(() => {});
        });
        window.addEventListener("online", () => { update().catch(() => {}); });
        // Retry a deferred application when the player returns to title/select
        // or another window closes; polling never calls registration.update().
        setInterval(() => { status().catch(() => {}); applyWaiting().catch(() => {}); }, 1500);
        await status();
        await applyWaiting();
        await update();
      } catch (_) { show(UNAVAILABLE); }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => { start().catch(() => { show(UNAVAILABLE); }); }, {once: true});
    } else { start().catch(() => { show(UNAVAILABLE); }); }
  } catch (_) {}
})();
