<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b2140">
<link rel="icon" href="icons/icon-192.png">
<title>콩콩이 대모험</title>
<style>@font-face{font-family:"Jua";src:url("fonts/Jua.woff2") format("woff2");font-display:block}</style>
<style>
/* 레이아웃: 가로 화면 전체가 게임판, 위엔 상태줄, 아래 양쪽에 큰 조작 버튼 */
:root{
  --night:#2b2140; --cream:#fff8e7; --ink:#3b2b1c; --leaf:#5cbf4a; --leaf-dark:#2f6e22;
  --berry:#ff6b8a; --sun:#ffc93c; --muted:#9a8a75; --lock:#e4d8c4;
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--font-display);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;left:0;top:0;display:block}

#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 16px) 0 calc(env(safe-area-inset-left,0px) + 16px);pointer-events:none}
.chip{background:rgba(255,248,231,.94);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:20px;
  display:flex;gap:12px;align-items:center;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums}
.hearts{color:var(--berry);letter-spacing:2px}
.hearts .off{color:var(--lock)}
.candy-ico{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--berry);border:2px solid var(--ink);vertical-align:-1px;margin-right:4px}
.stars-mini{color:#e3a800;letter-spacing:1px}
.shield{background:var(--leaf);color:#fff;border-radius:999px;padding:0 8px;font-size:15px}
#pauseBtn{pointer-events:auto;font-family:inherit;color:var(--ink);cursor:pointer;padding:4px 16px}

#controls{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
  padding:0 calc(env(safe-area-inset-right,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 20px);pointer-events:none}
#pad{pointer-events:auto;display:flex;gap:14px;touch-action:none}
.arrow{width:84px;height:84px;border-radius:26px;background:rgba(255,248,231,.5);border:3px solid rgba(59,43,28,.65);
  display:grid;place-items:center;font-size:34px;color:var(--ink)}
.arrow.on{background:rgba(255,201,60,.92);transform:scale(.94)}
#jumpBtn{pointer-events:auto;touch-action:none;width:108px;height:108px;border-radius:50%;background:rgba(92,191,74,.85);
  border:4px solid var(--leaf-dark);color:#fff;font-size:26px;display:grid;place-items:center;text-shadow:0 2px 0 var(--leaf-dark)}
#jumpBtn.on{background:rgba(255,201,60,.95);color:var(--ink);text-shadow:none;transform:scale(.94)}
#rbtns{display:flex;gap:16px;align-items:flex-end;pointer-events:none}
#throwBtn{pointer-events:auto;touch-action:none;width:86px;height:86px;border-radius:50%;background:rgba(255,159,67,.9);
  border:4px solid #b4601a;color:#fff;font-size:21px;display:grid;place-items:center;text-shadow:0 2px 0 #b4601a;margin-bottom:10px}
#throwBtn.on{background:rgba(255,201,60,.95);color:var(--ink);text-shadow:none;transform:scale(.94)}
.power{background:#ff9f43;color:#fff;border-radius:999px;padding:0 8px;font-size:15px}

#toast{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);font-size:clamp(26px,6vh,46px);color:#fff;
  -webkit-text-stroke:1.5px var(--ink);text-shadow:0 4px 0 var(--ink);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .35s}

.screen{position:fixed;inset:0;display:flex;overflow:auto;padding:16px;background:rgba(43,33,64,.45)}
.panel{margin:auto;background:var(--cream);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);
  padding:20px 26px;max-width:560px;width:100%;text-align:center;display:grid;gap:12px}
.panel.wide{max-width:780px}
h1{font-size:clamp(38px,11vh,72px);margin:0;color:var(--leaf);-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink);
  line-height:1.05;font-weight:400;text-wrap:balance}
h2{font-size:clamp(28px,7vh,40px);margin:0;font-weight:400;text-wrap:balance}
p{margin:0;font-size:20px;line-height:1.4}
.hint{font-size:16px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:inherit;font-size:24px;padding:10px 22px;border-radius:18px;border:3px solid var(--ink);background:var(--sun);
  color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.green{background:var(--leaf);color:#fff;text-shadow:0 2px 0 var(--leaf-dark)}
.btn.small{font-size:18px;padding:7px 14px}
.btn:focus-visible,.chip:focus-visible{outline:4px solid #4aa8ff;outline-offset:3px}
.panel.wide{padding:14px 20px;gap:10px}
.sel-head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.diff{display:flex;gap:8px}
.diff .btn{background:#fff}
.diff .btn[aria-pressed="true"]{background:var(--sun)}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.stage{display:grid;gap:1px;padding:7px 4px;background:#fff}
.stage .num{font-size:26px;line-height:1;color:var(--leaf);-webkit-text-stroke:1px var(--ink)}
.stage .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .st{color:#e3a800;font-size:16px;letter-spacing:1px}
.stage:disabled{background:var(--lock);color:var(--muted);border-color:var(--muted);box-shadow:0 5px 0 var(--muted);cursor:default}
.stage:disabled .num{color:var(--muted);-webkit-text-stroke:0}
.bigstars{font-size:clamp(40px,12vh,64px);letter-spacing:6px;color:#e3a800;line-height:1}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{display:grid;gap:2px;padding:8px 6px;background:#fff;font-size:18px}
.slot .dot{width:30px;height:30px;border-radius:50%;margin:0 auto 2px;border:3px solid var(--ink)}
.slot .sub{font-size:14px;color:var(--muted)}
.stage .best{font-size:12px;color:var(--muted);line-height:1}
.diff .btn.small{padding:7px 10px}
.worlds{display:flex;gap:8px;justify-content:center;margin:2px 0 4px}
.worlds .btn{background:#fff;padding:5px 14px;font-size:16px}
.worlds .btn[aria-pressed="true"]{background:var(--sun)}
.worlds .btn:disabled{background:var(--lock);color:var(--muted);border-color:var(--muted);box-shadow:0 4px 0 var(--muted)}
.bigstars .off{color:var(--lock)}
.stage .md{font-size:13px;line-height:1}
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.selbar .worlds{margin:0}
.extras{display:flex;gap:8px}
.extras .btn{padding:5px 12px;font-size:16px}
#bShop{background:#ffd3e2}
#bEndless{background:#c2e4fb}
#bEndless:disabled{background:var(--lock);color:var(--muted);border-color:var(--muted);box-shadow:0 4px 0 var(--muted)}
.medal-line{font-size:18px}
.warn{font-size:16px;color:#b8466e}
.dist{font-variant-numeric:tabular-nums}
/* 사탕 가게 */
.panel.shop{max-width:820px;padding:12px 18px;gap:8px}
.wallet{display:inline-flex;gap:6px;font-size:20px;padding:3px 14px}
.shop-body{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.shop-left{display:grid;gap:6px;justify-items:center}
.shop-left .hint{font-size:14px}
#shopCv{width:150px;height:150px;background:radial-gradient(circle at 50% 70%,#fff 0,#fff3d6 60%,#ffe3a8 100%);border:3px solid var(--ink);border-radius:20px}
.shop-right{display:grid;gap:8px}
.shop-right .worlds{justify-content:flex-start;margin:0}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
.item{display:grid;justify-items:center;gap:0;padding:4px 4px 6px;background:#fff;font-size:15px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.item canvas{width:48px;height:48px}
.item .nm{font-size:14px;white-space:nowrap}
.item .tag{font-size:12px;color:var(--leaf-dark);white-space:nowrap}
.item.on{background:#d9f5c8;border-color:var(--leaf-dark)}
.item.poor .tag{color:var(--muted)}
.item.poor canvas{opacity:.55}

#rotate{position:fixed;inset:0;z-index:20;background:var(--night);color:var(--cream);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
#rotate p{font-size:26px}
.phone{width:70px;height:120px;border:6px solid var(--cream);border-radius:16px;position:relative;animation:turn 2.2s ease-in-out infinite}
.phone::after{content:"";position:absolute;left:50%;bottom:6px;width:14px;height:4px;margin-left:-7px;border-radius:2px;background:var(--cream)}
@keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.phone{animation:none;transform:rotate(-90deg)}#toast{transition:none}}

/* ===== v6 화면 개선 ===== */
/* 조작 버튼: 배경만 옅게(뒤가 보이게), 아이콘·테두리는 또렷하게. 누를 때 크기는 그대로(누르는 자리 안 줄어듦) */
.arrow{background:rgba(255,248,231,.32);border:3px solid rgba(59,43,28,.75);color:var(--ink);
  text-shadow:0 0 3px #fff,0 0 6px #fff;box-shadow:0 3px 0 rgba(59,43,28,.35)}
.arrow.on{background:rgba(255,201,60,.85);transform:none;box-shadow:inset 0 0 0 4px rgba(59,43,28,.35)}
#jumpBtn{background:rgba(92,191,74,.45);text-shadow:0 2px 0 var(--leaf-dark),0 0 6px rgba(31,80,20,.9);box-shadow:0 4px 0 rgba(47,110,34,.45)}
#jumpBtn.on{background:rgba(255,201,60,.92);transform:none;box-shadow:inset 0 0 0 5px rgba(59,43,28,.3)}
#throwBtn{background:rgba(255,159,67,.55)}
#throwBtn.on{transform:none;box-shadow:inset 0 0 0 5px rgba(59,43,28,.3)}
/* '버튼 진하게'를 켜면 예전처럼 진한 버튼 */
body.boldctl .arrow{background:rgba(255,248,231,.88)}
body.boldctl #jumpBtn{background:rgba(92,191,74,.95)}
body.boldctl #throwBtn{background:rgba(255,159,67,.95)}
/* 상태줄: 도트 아이콘, 조금 작게 */
.chip{font-size:18px;padding:3px 12px;gap:10px}
.pxi{width:18px;height:16px;vertical-align:-2px;shape-rendering:crispEdges;overflow:visible;
  filter:drop-shadow(1.5px 0 0 #3b2b1c) drop-shadow(-1.5px 0 0 #3b2b1c) drop-shadow(0 1.5px 0 #3b2b1c) drop-shadow(0 -1.5px 0 #3b2b1c)}
.hearts .pxi+.pxi,.stars-mini .pxi+.pxi{margin-left:2px}

/* 처음 화면: 큰 상자 대신 위 제목 + 아래 저장칸 띠(뒤의 마을이 보여요) */
#scTitle{background:linear-gradient(180deg,rgba(43,33,64,.05) 0,rgba(43,33,64,.05) 45%,rgba(43,33,64,.4) 100%)}
.title-wrap{margin:auto;width:100%;max-width:820px;min-height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:center}
.title-top{display:grid;gap:4px;justify-items:center}
.title-top h1{color:#7ed957}
.title-top p{font-size:18px;color:#fff;-webkit-text-stroke:.6px var(--ink);text-shadow:0 2px 0 var(--ink)}
.title-bot{display:grid;gap:8px}
.title-bot .row{justify-content:space-between;align-items:center}
.title-bot .hint{color:#fff;text-shadow:0 1px 0 var(--ink)}
.slot{grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;padding:6px 10px;background:rgba(255,248,231,.96)}
.slot canvas{grid-row:1/3;width:60px;height:60px;border-radius:14px;background:radial-gradient(circle at 50% 75%,#fff 0,#e7f6d8 70%);image-rendering:pixelated}
.slot .nm{font-size:19px}

/* 단계 고르기: 위 두 줄(처음 화면·월드·가게 / 난이도·설명) + 길 따라 동그라미 지도 */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#scSelect{padding:10px}
.panel.sel{padding:10px 16px 14px;gap:8px;max-width:820px}
.sel .selbar{flex-wrap:nowrap;gap:8px}
.sel .selbar .worlds{flex:1;justify-content:flex-start}
.sel .btn.small{font-size:16px;padding:5px 11px;box-shadow:0 4px 0 var(--ink)}
.sel .worlds .btn,.sel .extras .btn{font-size:15px;padding:5px 10px;white-space:nowrap}
.diffbar{display:flex;align-items:center;gap:10px;min-width:0}
.diffbar .diff{gap:6px;flex:none}
.diffbar .diff .btn.small{padding:4px 9px;font-size:15px}
.diffbar .hint{flex:1;min-width:0;font-size:13px;line-height:1.25;text-align:left;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot .sub{font-size:12.5px;line-height:1.3}
.map{position:relative;height:clamp(150px,calc(100vh - 146px),240px);border-radius:20px;border:3px solid var(--ink);overflow:hidden;
  background:linear-gradient(180deg,#bfe9ff 0,#dff5c9 55%,#9fd77f 100%)}
.map.sea{background:linear-gradient(180deg,#c8eeff 0,#8fd3f4 50%,#f3dca6 100%)}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stages.map{display:block;grid-template-columns:none}
.node{position:absolute;transform:translate(-50%,-50%);width:50px;height:50px;padding:0;border-radius:50%;display:grid;place-items:center;
  background:#fff;box-shadow:0 4px 0 var(--ink)}
.node .num{font-size:24px;line-height:1}
.node:active{transform:translate(-50%,-44%);box-shadow:0 1px 0 var(--ink)}
.node .lab{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;width:76px;display:grid;justify-items:center;gap:0}
.node .st{font-size:13px;line-height:1;color:#e3a800;-webkit-text-stroke:.4px #8a6000;letter-spacing:0}
.node .nm{font-size:12px;line-height:1.15;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);
  background:rgba(255,248,231,.85);border-radius:6px;padding:0 4px}
.node .badge{position:absolute;top:-9px;right:-11px;font-size:15px;line-height:1;pointer-events:none}
.node.boss{background:#ffe6a6}
.node.clear{background:#d9f5c8}
.node:disabled{background:var(--lock);color:var(--muted);border-color:var(--muted);box-shadow:0 4px 0 var(--muted)}
.node:disabled .num{font-size:15px}
.node:disabled .nm{color:var(--muted)}
.here{position:absolute;width:44px;height:44px;transform:translate(-50%,-100%);pointer-events:none;animation:hop 1s ease-in-out infinite;image-rendering:pixelated}
@keyframes hop{0%,100%{margin-top:0}50%{margin-top:-8px}}

/* 성공 화면: 별이 하나씩 튀어나와요, 콩콩이가 폴짝 */
.cheer{width:72px;height:72px;margin:-6px auto -6px;animation:hop .7s ease-in-out infinite;image-rendering:pixelated}
.bigstars .s{display:inline-block;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.bigstars .s:nth-child(2){animation-delay:.25s}
.bigstars .s:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.here,.cheer,.bigstars .s{animation:none}}
</style>

<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div class="chip">
    <span id="hearts" class="hearts"></span>
    <span><i class="candy-ico"></i><b id="candyN">0</b></span>
    <span id="starsN" class="stars-mini"></span>
    <span id="distTag" class="dist" hidden></span>
    <span id="shieldTag" class="shield" hidden>새싹 보호막</span>
    <span id="powerTag" class="power" hidden></span>
  </div>
  <button id="pauseBtn" class="chip" aria-label="잠깐 멈추기">멈춤</button>
</div>

<div id="controls" hidden>
  <div id="pad" aria-label="왼쪽 오른쪽 이동"><div class="arrow" id="aL">◀</div><div class="arrow" id="aR">▶</div></div>
  <div id="rbtns"><div id="throwBtn" role="button" aria-label="부메랑 던지기" hidden>던지기</div><div id="jumpBtn" role="button" aria-label="점프">점프</div></div>
</div>

<div id="toast"></div>

<section id="scTitle" class="screen">
  <div class="title-wrap">
    <div class="title-top">
      <h1>콩콩이 대모험</h1>
      <p>새싹 콩콩이를 깃발까지 데려다 주세요!</p>
    </div>
    <div class="title-bot">
      <div class="slots" id="slotList" aria-label="누가 할까요?"></div>
      <div class="row"><p class="hint">왼쪽 버튼으로 걷고, 오른쪽 초록 버튼으로 점프해요</p><button class="btn small" id="bSound">소리 켜짐</button></div>
    </div>
  </div>
</section>

<section id="scSelect" class="screen" hidden>
  <div class="panel wide sel">
    <h2 class="sr">어디로 갈까요?</h2>
    <div class="selbar">
      <button class="btn small" id="bBackTitle">처음 화면</button>
      <div class="worlds" id="worldTabs"></div>
      <div class="extras"><button class="btn small" id="bShop">🍬 가게 <b id="selWallet">0</b></button><button class="btn small" id="bEndless">끝없는 길</button></div>
    </div>
    <div class="diffbar">
      <div class="diff" role="group" aria-label="난이도">
        <button class="btn small" id="dEasy" data-d="easy">쉬워요</button><button class="btn small" id="dNormal" data-d="normal">보통</button><button class="btn small" id="dHard" data-d="hard">어려워요</button><button class="btn small" id="dChallenge" data-d="challenge">도전</button><button class="btn small" id="dAdult" data-d="adult">어른</button><button class="btn small" id="dUltimate" data-d="ultimate">얼티메이트</button>
      </div>
      <p class="hint" id="diffInfo"></p>
    </div>
    <div class="stages" id="stageList"></div>
  </div>
</section>

<section id="scPause" class="screen" hidden>
  <div class="panel">
    <h2>잠깐 쉬어요</h2>
    <div class="row">
      <button class="btn green" id="bResume">계속하기</button>
      <button class="btn" id="bRetry">처음부터 다시</button>
      <button class="btn" id="bToSelect">스테이지 고르기</button>
      <button class="btn small" id="bSound2">소리 켜짐</button>
      <button class="btn small" id="bBold" aria-pressed="false">버튼 진하게</button>
    </div>
  </div>
</section>

<section id="scClear" class="screen" hidden>
  <div class="panel">
    <canvas class="cheer" id="clearHero" width="144" height="144" aria-hidden="true"></canvas>
    <h2 id="clearTitle">스테이지 성공!</h2>
    <div class="bigstars" id="clearStars"></div>
    <p id="clearInfo"></p>
    <p id="clearMedal" class="medal-line"></p>
    <p id="clearWarn" class="warn" hidden>기록이 저장되지 않았어요</p>
    <div class="row"><button class="btn green" id="bNext">다음 스테이지</button><button class="btn" id="bClearSelect">스테이지 고르기</button></div>
  </div>
</section>

<section id="scShop" class="screen" hidden>
  <div class="panel wide shop">
    <div class="sel-head">
      <button class="btn small" id="bShopBack">돌아가기</button>
      <h2>사탕 가게</h2>
      <span class="chip wallet">🍬 <b id="shopWallet">0</b></span>
    </div>
    <div class="shop-body">
      <div class="shop-left">
        <canvas id="shopCv" width="300" height="300"></canvas>
        <p class="hint">단계를 깨면<br>사탕이 모여요</p>
        <p class="warn" id="shopNote" hidden>기록이 저장되지 않는 상태라 살 수 없어요</p>
      </div>

<script>
(() => {
'use strict';
const T = 32, ROWS = 12, VH = ROWS * T, MINVW = 14 * T;
const GRAV = 1800, MAXFALL = 900, RUN = 190, ACC_G = 1500, ACC_A = 1000;
const JUMP = 640, SPRING = 980, STOMP = 430, STOMP_HI = 650;
const SOLID = new Set(['G', 'B', '?', '!', 'U', 'W']);
const $ = s => document.querySelector(s);

// ---------- 테마(스테이지 분위기) ----------
const THEMES = {
  meadow: {sky:['#8fd8ff','#e2f6ff'], sun:'#ffe27a', clouds:'#ffffff', hills:[['#b5e3a0',0.2,250,60,220],['#8fd174',0.4,285,40,170]],
    dirt:'#b9824f', dirt2:'#9c6a3d', grass:'#5cbf4a', grass2:'#8be06d', brick:'#d9824b', brick2:'#a85c2e', ledge:'#ffffff', ledge2:'#cfe6f7'},
  flower: {sky:['#ffc8dd','#fff1f6'], sun:'#fff3a8', clouds:'#ffffff', hills:[['#f6b3cf',0.2,240,60,230],['#e98fb5',0.4,280,40,170]],
    dirt:'#a8744a', dirt2:'#8c5f3a', grass:'#62c454', grass2:'#93e07a', flowers:true, brick:'#e98a6f', brick2:'#b55e47', ledge:'#ffffff', ledge2:'#f3d3e2'},
  cave:   {sky:['#2a2145','#4a3870'], cave:true, deco:'#3a2d5c', crystal:'#9be7ff', hills:[['#35295a',0.3,300,40,200]],
    dirt:'#5d4b80', dirt2:'#4a3b69', grass:'#9f8ae0', grass2:'#c9bbff', brick:'#7a68a6', brick2:'#54467a', ledge:'#b7a6ff', ledge2:'#7f6cd1'},
  sky:    {sky:['#5fb8ff','#dff3ff'], sun:'#fff0a0', clouds:'#ffffff', manyClouds:true, hills:[['#eaf6ff',0.15,330,30,240]],
    dirt:'#e6f1fb', dirt2:'#c9dff2', grass:'#ffffff', grass2:'#ffffff', brick:'#a8c8ea', brick2:'#7ea6d2', ledge:'#ffffff', ledge2:'#bcdcf5'},
  castle: {sky:['#ffb59e','#ffe8c7'], sun:'#fff6b0', clouds:'#fff4f8', castle:true, deco:'#f7a3c0', hills:[['#f9c3d6',0.25,290,30,210]],
    dirt:'#c48bd4', dirt2:'#a86fb9', grass:'#ff7fb0', grass2:'#ffc2da', brick:'#ffcf6b', brick2:'#d99a2c', ledge:'#ffffff', ledge2:'#f8cfe0'},
  pond:   {sky:['#9ee6e0','#e8fbf6'], sun:'#ffe27a', clouds:'#ffffff', water:'#4fb3d9', hills:[['#a8dcc0',0.2,250,60,220],['#79c79f',0.4,285,40,170]],
    dirt:'#8a6a48', dirt2:'#73563a', grass:'#4fb36a', grass2:'#7fd88e', brick:'#c98a5a', brick2:'#9a6338', ledge:'#6fcf6a', ledge2:'#3f9a4a'},
  forest: {sky:['#6f9f7a','#d4ecc8'], clouds:'#eef7e8', hills:[['#4c805a',0.2,240,70,200],['#356645',0.4,280,50,160]],
    dirt:'#6b4a32', dirt2:'#553925', grass:'#3f9c4a', grass2:'#6cc070', flowers:true, brick:'#8a6a4a', brick2:'#5e4630', ledge:'#d4aa6e', ledge2:'#8a6a3a'},
  night:  {sky:['#1b2350','#4a4f8f'], sun:'#fff6c8', moon:true, stars:true, hills:[['#2c3570',0.2,260,60,220],['#232a5a',0.4,290,40,170]],
    dirt:'#3d3f6e', dirt2:'#2f3058', grass:'#6f7fd6', grass2:'#a8b4ff', brick:'#5a5f9a', brick2:'#3f4378', ledge:'#dfe4ff', ledge2:'#9aa3e0'},
  beach:  {sky:['#7fd3ff','#e8f8ff'], sun:'#fff0a0', clouds:'#ffffff', ocean:'#3fa9e0', hills:[['#f3dca2',0.3,305,25,230]],
    dirt:'#e8c98a', dirt2:'#d4b06a', grass:'#f7e4b0', grass2:'#fff6dc', brick:'#e9a86a', brick2:'#b97a42', ledge:'#ffffff', ledge2:'#cfe6f7'},
  sea:    {sky:['#1d6fa5','#7fd0ee'], bubbles:true, hills:[['#2b7fae',0.2,280,50,200],['#1f6a93',0.4,300,40,170]],
    dirt:'#c9a86a', dirt2:'#a8874c', grass:'#ff8fa3', grass2:'#ffc8d2', brick:'#7fb0c9', brick2:'#4f86a3', ledge:'#ffe3ef', ledge2:'#f2a7c0'},
  seacave:{sky:['#102a4c','#245a86'], cave:true, bubbles:true, deco:'#183a62', crystal:'#9be7ff', hills:[['#173c66',0.3,300,40,200]],
    dirt:'#4f6f8f', dirt2:'#3d5a78', grass:'#7fe0d0', grass2:'#c2fff4', brick:'#6a8fb0', brick2:'#46698a', ledge:'#bff3ff', ledge2:'#6fbfd9'},
  deep:   {sky:['#0e2448','#2a6aa0'], bubbles:true, castle:true, deco:'#1d4a7c', hills:[['#173f6c',0.3,300,40,200]],
    dirt:'#6a5a8a', dirt2:'#54466f', grass:'#ff9fc0', grass2:'#ffd3e2', brick:'#8a74b8', brick2:'#5f4d8a', ledge:'#ffe3ef', ledge2:'#f2a7c0'},
  secret: {sky:['#3a2470','#8a5cc8'], stars:true, hills:[],
    dirt:'#6a4c9c', dirt2:'#563c84', grass:'#ffd23f', grass2:'#fff2a8', brick:'#b388ff', brick2:'#7a52c8', ledge:'#ffe9a8', ledge2:'#d9b24a'},
};

// ---------- 스테이지 만들기 도구 ----------
// 좌표: x = 칸 번호(왼쪽부터), r = 줄 번호(0 = 맨 위, 11 = 맨 아래). 땅 높이 2칸이면 콩콩이는 9번 줄에 서요.
const MAXW = 1000;
// 스테이지는 난이도 묶음(tier 0 쉬움 / 1 보통 / 2 어려움)마다 따로 만들어 둬요. 도전 조각이 tier에 따라 어려워져요.
function makeLevel(name, theme, fn, opt = {}) {
  const cache = {};
  return {name, theme, home: !!opt.home, get(tier = 0) { return cache[tier] || (cache[tier] = buildLevel(name, theme, fn, opt, tier)); }};
}
function buildLevel(name, theme, fn, opt, tier) {
  const g = Array.from({length: ROWS}, () => Array(MAXW).fill('.'));
  const ents = [], waters = [];
  let w = MAXW;
  const api = {
    ground(x0, x1, h = 2) { for (let x = x0; x <= x1; x++) for (let r = ROWS - h; r < ROWS; r++) g[r][x] = 'G'; },
    ceil(x0, x1, h = 1) { for (let x = x0; x <= x1; x++) for (let r = 0; r < h; r++) g[r][x] = 'G'; },
    row(x0, x1, r, ch = 'B') { for (let x = x0; x <= x1; x++) g[r][x] = ch; },
    tile(x, r, ch) { g[r][x] = ch; },
    candy(x0, x1, r) { for (let x = x0; x <= x1; x++) ents.push({t:'candy', x, r}); },
    star(x, r) { ents.push({t:'star', x, r}); },
    snail(x, r = 9) { ents.push({t:'snail', x, r}); },
    bee(x, r) { ents.push({t:'bee', x, r}); },
    frog(x, r = 9) { ents.push({t:'frog', x, r}); },
    spikes(x0, x1, r = 9) { for (let x = x0; x <= x1; x++) ents.push({t:'spike', x, r}); },
    spring(x, r = 9) { ents.push({t:'spring', x, r}); },
    check(x, r = 9) { ents.push({t:'check', x, r}); },
    goal(x, r = 9) { ents.push({t:'goal', x, r}); },
    sign(x, msg, r = 9) { ents.push({t:'sign', x, r, msg}); },
    cloud(x, r, range, len = 3, rev = false, spd = 50) { ents.push({t:'cloud', x, r, range, len, rev, spd}); },
    lift(x, r, range, len = 3) { ents.push({t:'lift', x, r, range, len}); },
    // 바다: x0~x1 칸, top 줄부터 아래가 물이에요(바닥은 따로 만들어요)
    water(x0, x1, top) { waters.push({x0, x1, top}); },
    crab(x, r = 9) { ents.push({t:'crab', x, r}); },
    jelly(x, r) { ents.push({t:'jelly', x, r}); },
    shark(x, r, range) { ents.push({t:'shark', x, r, range}); },
    turtle(x, r, range) { ents.push({t:'turtle', x, r, range}); },
    // 중간 보스 방: x0~x0+24 안에서 싸우고, x0+25 칸의 문(W)은 보스를 이기면 열려요.
    boss(x0, kind) {
      ents.push({t:'boss', kind, x:x0 + 18, r:9, ax0:x0 + 1, ax1:x0 + 25, gate:x0 + 25, trig:x0 + 8, door:x0 + 5});
      for (let r = 0; r < ROWS - 2; r++) g[r][x0 + 25] = 'W';
    },
    item(x, r, k) { ents.push({t:'item', x, r, k}); },
    exit(x, r = 9) { ents.push({t:'exit', x, r}); },
    // 마지막 계단과 깃발. 스테이지 길이가 여기서 정해져요.
    // 끝없는 길 덩어리: 깃발 없이 길이만 정해요
    end(x) { w = x; return w; },
    finish(x) { api.ground(x, x + 15); api.ground(x, x, 3); api.ground(x + 1, x + 1, 4); api.ground(x + 2, x + 2, 5); api.goal(x + 9); w = x + 16; return w; },
  };
  api.run = makeSegments(api, tier); api.tier = tier;
  fn(api);
  return {name, theme, w, g: g.map(r => r.slice(0, w)), ents: ents.filter(e => e.x < w), home: !!opt.home, waters,
          spots: enemySpots(g, ents, w).filter(x => waters.every(q => x < q.x0 - 4 || x > q.x1 + 4)), segs: api.run.segs};
}

// 악당을 더 놓을 수 있는 평평한 땅 자리(시작·중간 깃발·보스 방·다른 물건 근처는 빼요)
function enemySpots(g, ents, w) {
  const flat = x => g[ROWS - 2][x] === 'G' && g[ROWS - 3][x] === '.' && g[ROWS - 4][x] === '.' && g[ROWS - 5][x] === '.';
  const busy = new Set();
  for (const e of ents) {
    if (e.t === 'candy' || e.t === 'star' || e.t === 'item' || e.t === 'exit') continue;
    if (e.t === 'boss') { for (let x = e.ax0 - 4; x <= e.gate + 5; x++) busy.add(x); continue; }
    const pad = e.t === 'check' ? 6 : (e.t === 'cloud' || e.t === 'lift') ? 4 + (e.range || 0) + (e.len || 3) : 3;
    for (let x = e.x - 3; x <= e.x + pad; x++) busy.add(x);
  }
  const out = [];
  for (let x = 22; x < w - 24; x++) {
    let ok = !busy.has(x);
    for (let k = -6; k <= 6 && ok; k++) if (!flat(x + k)) ok = false;
    if (ok) out.push(x);
  }
  return out;
}

// 이어 붙이는 구간 조각. o = 시작 칸, 돌려주는 값 = 다음 조각이 시작할 칸.
// 땅으로 시작하는 조각 뒤에는 무엇이든, 구멍·구름 조각 뒤에는 땅으로 시작하는 조각이 와야 해요.
function makeSegments(a, tier) {
  // 물 웅덩이: o~o+1 땅, 계단 o+2~o+4, 둑 o+5~o+6(높이 6), 물 x0~x0+n-1(바닥 높이 1), 둑, 계단, 땅. fill(x0)으로 안을 채워요
  const pool = (o, n, fill) => {
    const x0 = o + 7, x1 = x0 + n - 1;
    a.ground(o, o + 1); a.ground(o + 2, o + 2, 3); a.ground(o + 3, o + 3, 4); a.ground(o + 4, o + 4, 5); a.ground(o + 5, o + 6, 6);
    a.ground(x0, x1, 1); a.water(x0, x1, 6); fill(x0);
    a.ground(x1 + 1, x1 + 2, 6); a.ground(x1 + 3, x1 + 3, 5); a.ground(x1 + 4, x1 + 4, 4); a.ground(x1 + 5, x1 + 5, 3); a.ground(x1 + 6, x1 + 7, 2);
    return x1 + 8;
  };
  const S = {
    check(o) { a.ground(o, o + 5); a.check(o + 3); return o + 6; },
    flat(o, n = 6) { a.ground(o, o + n - 1); return o + n; },
    gap2(o) { return o + 2; },
    gap3(o) { return o + 3; },
    snails(o) { a.ground(o, o + 19); a.snail(o + 6); a.snail(o + 13); a.candy(o + 8, o + 11, 8); a.tile(o + 9, 6, '?'); return o + 20; },
    bees(o) { a.ground(o, o + 19); a.bee(o + 4, 7); a.bee(o + 10, 8); a.bee(o + 16, 7); a.candy(o + 3, o + 17, 9); return o + 20; },
    towers(o) {
      a.ground(o, o + 17); a.ground(o + 3, o + 4, 3); a.ground(o + 6, o + 8, 4); a.ground(o + 10, o + 12, 5);
      a.candy(o + 10, o + 12, 6); a.snail(o + 15); return o + 18;
    },
    bricks(o) { a.ground(o, o + 15); a.row(o + 4, o + 8, 7, 'B'); a.candy(o + 4, o + 8, 6); a.snail(o + 12); return o + 16; },
    spring(o) { a.ground(o, o + 15); a.spring(o + 2); a.row(o + 4, o + 9, 3, '-'); a.candy(o + 4, o + 9, 2); a.snail(o + 12); return o + 16; },
    spikes(o) { a.ground(o, o + 17); a.spikes(o + 4, o + 5); a.spikes(o + 10, o + 11); a.candy(o + 4, o + 5, 7); a.candy(o + 10, o + 11, 7); return o + 18; },
    frogs(o) { a.ground(o, o + 17); a.frog(o + 6); a.frog(o + 12); a.tile(o + 9, 6, '?'); return o + 18; },
    tunnel(o) { a.ground(o, o + 16); a.ceil(o + 3, o + 13, 6); a.snail(o + 7); a.candy(o + 4, o + 12, 8); return o + 17; },
    pads(o) { a.row(o + 1, o + 1, 9, '-'); a.row(o + 3, o + 3, 9, '-'); return o + 5; },
    clouds(o) { a.row(o + 2, o + 4, 8, '-'); a.row(o + 7, o + 9, 6, '-'); a.candy(o + 7, o + 9, 5); a.row(o + 12, o + 14, 8, '-'); return o + 17; },
    moving(o) { a.cloud(o, 8, 3, 3); return o + 7; },
    lift(o) { a.lift(o + 1, 9, 5, 3); a.row(o + 6, o + 9, 4, '-'); a.candy(o + 6, o + 9, 3); return o + 12; },
    // 보스 방: 왼쪽 발판(o+4~o+6) 위에 비밀 문이 생겨요
    boss(o) { a.ground(o, o + 25); a.row(o + 4, o + 6, 7, '-'); a.sign(o + 2, '중간 보스! 머리를 콩 밟아요'); a.boss(o); return o + 26; },
    // ----- v3 도전 조각 (tier가 높을수록 어려워요). 모두 땅으로 시작해서 땅으로 끝나요 -----
    rest(o) { a.ground(o, o + 9); a.candy(o + 2, o + 7, 8); return o + 10; },
    gapChain(o) {
      a.ground(o, o + 3);
      if (tier === 0) { a.ground(o + 6, o + 9); a.ground(o + 12, o + 15); a.candy(o + 4, o + 5, 7); a.candy(o + 10, o + 11, 7); return o + 16; }
      if (tier === 1) { a.ground(o + 7, o + 9); a.ground(o + 12, o + 14); a.ground(o + 18, o + 21); a.candy(o + 4, o + 6, 7); a.candy(o + 15, o + 17, 7); return o + 22; }
      a.ground(o + 7, o + 8); a.ground(o + 12, o + 13); a.ground(o + 17, o + 20); a.bee(o + 10, 7); a.candy(o + 4, o + 6, 7); a.candy(o + 14, o + 16, 7); return o + 21;
    },
    beeGap(o) {
      a.ground(o, o + 4);
      if (tier === 0) { a.bee(o + 5, 5); a.ground(o + 7, o + 11); a.candy(o + 5, o + 6, 6); return o + 12; }
      a.bee(o + 6, 7); a.ground(o + 8, o + 12); return o + 13;
    },
    ledgeSnail(o) {
      a.ground(o, o + 3); a.row(o + 5, o + 10, 8, '-'); a.snail(o + 8, 7); a.candy(o + 5, o + 7, 6);
      a.ground(o + 12, o + 16); if (tier >= 1) a.snail(o + 15); return o + 17;
    },
    cloudHop(o) {
      a.ground(o, o + 2); a.cloud(o + 3, 8, 3, 3);
      if (tier === 0) { a.ground(o + 10, o + 13); return o + 14; }
      // 두 구름은 반대로 움직여서, 첫 구름이 오른쪽 끝일 때 두 번째 구름이 바로 옆에 와요
      a.cloud(o + 9, 8, 3, 3, true); if (tier >= 2) a.bee(o + 9, 5);
      a.candy(o + 8, o + 10, 5); a.ground(o + 16, o + 19); return o + 20;
    },
    liftBee(o) {
      a.ground(o, o + 2); a.lift(o + 4, 9, 5, 3); a.row(o + 9, o + 12, 4, '-'); a.candy(o + 9, o + 12, 3);
      if (tier >= 1) a.bee(o + 11, 2);
      a.ground(o + 15, o + 19); return o + 20;
    },
    lowGap(o) {
      a.ground(o, o + 5); a.ceil(o + 2, o + 16, 6); a.ground(o + 8, o + 17); a.candy(o + 3, o + 5, 8);
      if (tier >= 1) a.snail(o + 13); return o + 18;
    },
    spikeHop(o) {
      a.ground(o, o + 17);
      if (tier === 0) { a.spikes(o + 4, o + 5); a.spikes(o + 10, o + 11); a.candy(o + 4, o + 5, 7); a.candy(o + 10, o + 11, 7); }
      else if (tier === 1) { a.spikes(o + 3, o + 4); a.spikes(o + 7, o + 8); a.spikes(o + 12, o + 14); a.candy(o + 12, o + 14, 7); }
      else { a.spikes(o + 3, o + 5); a.spikes(o + 8, o + 10); a.spikes(o + 13, o + 14); a.candy(o + 8, o + 10, 7); }
      return o + 18;
    },
    // 숨은 길: 스프링으로 올라가면 사탕 길과 새싹 상자
    secretPath(o) {
      a.ground(o, o + 17); a.spring(o + 2); a.row(o + 4, o + 13, 3, '-'); a.candy(o + 4, o + 12, 2); a.tile(o + 9, 0, '!'); a.snail(o + 11);
      return o + 18;
    },
    // ----- 어른(tier 3) 전용 조각: 직접 넘는 구멍은 3칸 이하, 넓은 구멍은 움직이는 구름으로 나눠 건너요 -----
    adultGapChain(o) {
      a.ground(o, o + 3); a.ground(o + 7, o + 9); a.ground(o + 13, o + 15); a.ground(o + 19, o + 24);
      a.snail(o + 23); a.candy(o + 4, o + 6, 7); a.candy(o + 16, o + 18, 7); return o + 25;
    },
    adultWideGap(o) {
      // 구멍 8칸(o+4~o+11). 구름이 오른쪽 끝(o+7~o+9)에 오면 건너편까지 2칸
      a.ground(o, o + 3); a.cloud(o + 4, 8, 3, 3); a.candy(o + 5, o + 10, 6);
      a.ground(o + 12, o + 17); a.snail(o + 16); return o + 18;
    },
    adultSpikeChain(o) {
      a.ground(o, o + 19); a.spikes(o + 3, o + 4); a.spikes(o + 9, o + 10); a.spikes(o + 15, o + 16);
      a.bee(o + 12, 5); a.candy(o + 9, o + 10, 7); return o + 20;
    },
    // ----- 월드2 바다 조각: 계단 둑(높이 3→6) + 물(윗면 6번 줄, 깊이 5칸) + 둑, 모두 땅(높이 2)으로 시작·끝 -----
    say(o, msg) { a.ground(o, o + 5); a.sign(o + 2, msg); return o + 6; },
    starLedge(o) { a.ground(o, o + 9); a.row(o + 3, o + 5, 7, '-'); a.star(o + 4, 5); a.candy(o + 3, o + 5, 6); return o + 10; },
    swim(o) { return pool(o, 8, x => { a.candy(x + 1, x + 6, 8); if (tier >= 2) a.jelly(x + 4, 8); }); },
    starSwim(o) { return pool(o, 8, x => { a.candy(x + 1, x + 6, 7); a.star(x + 4, 10); }); },
    crabs(o) { a.ground(o, o + 19); a.crab(o + 6); a.crab(o + 13); if (tier >= 2) a.crab(o + 17); a.candy(o + 8, o + 11, 8); a.tile(o + 9, 6, '?'); return o + 20; },
    jellyPool(o) {
      return pool(o, 12, x => { a.jelly(x + 3, 8); a.jelly(x + 8, 7); if (tier >= 1) a.jelly(x + 6, 9); a.candy(x + 1, x + 10, 6); });
    },
    sharkPool(o) {
      return pool(o, 14, x => { a.shark(x + 1, 9, 9); a.candy(x + 1, x + 12, 6); if (tier >= 2) a.jelly(x + 10, 7); });
    },
    turtleRide(o) {
      return pool(o, 14, x => { a.turtle(x, 6, 11); a.jelly(x + 4, 8); a.jelly(x + 10, 9); if (tier >= 1) a.shark(x + 1, 9, 9); a.candy(x + 2, x + 11, 4); });
    },
    // ----- 월드2 후반(16~20) 조각 -----
    // 산호 사이: 물 가운데 산호 줄(8번 줄) 위·아래 두 길. 위엔 해파리, 아래엔 게
    coralPool(o) {
      return pool(o, 14, x => {
        a.row(x + 3, x + 10, 8, 'B'); a.candy(x + 3, x + 10, 7); a.candy(x + 4, x + 9, 10);
        if (tier >= 1) { a.jelly(x + 7, 6); a.crab(x + 6, 10); }
        if (tier >= 2) a.crab(x + 9, 10);
      });
    },
    // 거북이 → 가운데 선착장 → 상어 바다를 헤엄쳐 건너기
    turtleDock(o) {
      return pool(o, 22, x => {
        a.turtle(x, 6, 9); a.ground(x + 9, x + 10, 6); a.candy(x + 1, x + 7, 4); a.candy(x + 9, x + 10, 5);

      });
    },
    // 바위 아래로 잠수: 수면까지 내려온 바위(0~6줄) 밑 물길(7~10줄)을 지나가요
    caveDive(o) {
      return pool(o, 12, x => {
        a.ceil(x + 2, x + 9, 7); a.candy(x + 3, x + 8, 9);

      });

    // 대왕 문어 방: 마른 바닥 24칸, 이겨야 오른쪽 문이 열려요(비밀의 방은 없어요)
    octo(o) { a.ground(o, o + 25); a.sign(o + 2, '대왕 문어! 머리가 내려오면 콩 밟아요'); a.boss(o, 'octo'); return o + 26; },
    adultSeaSlalom(o) {
      return pool(o, 18, x => { a.shark(x + 1, 9, 6); a.jelly(x + 9, 7); a.shark(x + 10, 7, 6); a.jelly(x + 16, 9); a.candy(x + 1, x + 16, 6); });
    },
    // ----- 얼티메이트(tier 4) 정밀 조각: 운이 아니라 조작 실력. 조각 안엔 움직이는 적을 두지 않아요 -----
    // 가시 사이 섬: 2칸 섬 → 1칸 섬(꼭 내려야 함, 착지 창 20px) → 2칸 섬 → 마지막 가시 3칸은 달려서
    ultimateSpikeIslands(o) {
      a.ground(o, o + 20); a.spikes(o + 3, o + 4); a.spikes(o + 7, o + 8); a.spikes(o + 10, o + 11); a.spikes(o + 14, o + 16);
      a.candy(o + 9, o + 9, 8); return o + 21;
    },
    // 2칸 발판 계단: 내려앉기 직전에 멈춰 서기(공중 제동)
    ultimateAirSteps(o) {
      a.ground(o, o + 4); a.row(o + 7, o + 8, 8, '-'); a.row(o + 10, o + 11, 6, '-'); a.ground(o + 13, o + 17, 5); a.ground(o + 18, o + 21);
      a.candy(o + 10, o + 11, 5); return o + 22;
    },
    // 작고 빠른 구름(2칸, 속도 70): 타는 순간과 내리는 순간을 골라요
    ultimateMovingDock(o) { a.ground(o, o + 4); a.cloud(o + 5, 8, 4, 2, false, 70); a.ground(o + 13, o + 17); return o + 18; },
    // 물속 바위 3개: 아래 → 위 → 아래로 번갈아 지나가기(통로 높이 모두 64px)
    ultimateSwimWeave(o) {
      return pool(o, 20, x => {
        a.ceil(x + 3, x + 4, 9); a.ground(x + 9, x + 10, 4); a.ceil(x + 15, x + 16, 9);
        a.candy(x + 3, x + 4, 10); a.candy(x + 9, x + 10, 6); a.candy(x + 15, x + 16, 10);
      });
    },
    adultMovingStep(o) {
      // 빠른 구름 두 개(반대로 움직여서 첫 구름이 오른쪽 끝일 때 두 번째가 바로 옆)
      a.ground(o, o + 2); a.cloud(o + 3, 8, 3, 3, false, 65); a.cloud(o + 9, 8, 3, 3, true, 65); a.bee(o + 9, 5);
      a.candy(o + 8, o + 10, 5); a.ground(o + 16, o + 19); return o + 20;
    },
  };
  // 어른은 도전 조각을 어른 조각으로 바꾸고, 쉼터(rest) 뒤에 넓은 구멍을 하나씩 더해요
  const ADULT = {gapChain: ['adultGapChain'], spikeHop: ['adultSpikeChain'], cloudHop: ['adultMovingStep'], rest: ['rest', 'adultWideGap'], sharkPool: ['adultSeaSlalom']};
  // 얼티메이트는 어른 표에 정밀 조각 표를 덮어써요(원래 조각 이름 기준으로 한 번만 바꿔요)
  const ULT = Object.assign({}, ADULT, {gapChain: ['ultimateAirSteps'], spikeHop: ['ultimateSpikeIslands'], cloudHop: ['ultimateMovingDock'],
    rest: ['rest', 'ultimateSpikeIslands'], ledgeSnail: ['ultimateAirSteps'], jellyPool: ['ultimateSwimWeave'], swim: ['ultimateSwimWeave']});
  const run = (x, list) => {
    const map = tier >= 4 ? ULT : tier >= 3 ? ADULT : null;
    if (map) list = list.flatMap(it => (!Array.isArray(it) && map[it]) || [it]);
    for (const it of list) { const [k, ...args] = Array.isArray(it) ? it : [it]; run.segs.push({k, x}); x = S[k](x, ...args); }
    return x;
  };
  run.segs = [];
  return run;
}

// ---------- 저장 ----------
// v4 저장(시험도구/migrate_v4.js와 같은 코드). 옛 v3·v1 기록은 지우지 않고 새 키로 옮겨요.
// NLEV는 계획한 전체 단계 수(월드 2개=20)로 고정 — 아직 안 만든 단계 칸도 미리 만들어 둬요.
const NLEV = 20;
// 브라우저에 이 함수 전체를 붙여 넣어 사용할 수 있어요.
function loadStoreV4(ls, NLEV, DKEYS) {
  const KEY = 'kongkong-adventure-v4';
  const V3_KEY = 'kongkong-adventure-v3';
  const V1_KEY = 'kongkong-adventure-v1';
  const OLD_KEYS = ['easy', 'normal', 'hard', 'challenge'];
  const BAD_MSG = '기록을 읽지 못해서 새로 시작해요';
  const BROKEN_KEY = 'kongkong-adventure-broken';

  function newRec() {
    return {
      stars: Array(NLEV).fill(0),
      crown: Array(NLEV).fill(false),
      best: Array(NLEV).fill(0)
    };
  }

  function newStore() {
    return {
      schema: 4,
      slot: 0,
      sound: true,
      slots: Array.from({length: 3}, function () {
        return {
          unlocked: 1,
          diff: 'easy',
          rec: Object.fromEntries(DKEYS.map(function (key) { return [key, newRec()]; }))
        };
      })
    };
  }

  function integer(value, min, max) {
    let number;
    try { number = Number(value); } catch (e) { number = NaN; } // {"toString":null} 같은 값도 그 칸만 기본값
    return Math.min(max, Math.max(min, Number.isFinite(number) ? Math.trunc(number) : min));
  }

  function positiveTime(value) {
    return typeof value === 'number' && Number.isFinite(value) && value > 0;
  }

  function fixRec(record, limit) {
    const result = newRec();
    const r = record || {};
    const stars = Array.isArray(r.stars) ? r.stars : [];
    const crown = Array.isArray(r.crown) ? r.crown : [];
    const best = Array.isArray(r.best) ? r.best : [];
    for (let i = 0; i < Math.min(NLEV, limit); i++) {
      result.stars[i] = integer(stars[i], 0, 3);
      result.crown[i] = crown[i] === true;
      result.best[i] = positiveTime(best[i]) ? best[i] : 0;
    }
    return result;
  }

  function hasSlots(value) {
    return value && Array.isArray(value.slots) && value.slots.length === 3;
  }

  function completedTen(slot) {
    return OLD_KEYS.some(function (key) {
      const r = slot.rec && slot.rec[key];
      if (!r) return false;
      const star = Array.isArray(r.stars) ? r.stars[9] : undefined;
      const crown = Array.isArray(r.crown) ? r.crown[9] : undefined;
      const best = Array.isArray(r.best) ? r.best[9] : undefined;
      return (Number.isInteger(star) && star >= 1 && star <= 3) ||
        crown === true || positiveTime(best);
    });
  }

  function normalize(value, fromV3) {
    const result = newStore();
    result.slot = integer(value.slot, 0, 2);
    result.sound = value.sound !== false;
    result.slots.forEach(function (slot, i) {
      const old = value.slots[i] || {};
      slot.unlocked = integer(old.unlocked, 1, fromV3 ? Math.min(10, NLEV) : NLEV);
      if (fromV3 && completedTen(old)) {
        slot.unlocked = Math.max(slot.unlocked, Math.min(11, NLEV));
      }
      slot.diff = DKEYS.includes(old.diff) && (!fromV3 || OLD_KEYS.includes(old.diff))
        ? old.diff : 'easy';
      DKEYS.forEach(function (key) {
        if (!fromV3 || OLD_KEYS.includes(key)) {
          slot.rec[key] = fixRec(old.rec && old.rec[key], fromV3 ? 10 : NLEV);
        }
      });
    });
    return result;
  }

  // 깨진 기록: 옛 키는 그대로 두고 새 v4로 시작해요(매번 저장 못 하는 상태에 갇히지 않게).
  // v4가 깨졌으면 원본 문자열을 따로 보관한 뒤에만 덮어써요. 보관이 안 되면 이번엔 저장하지 않아요.
  function unreadable(raw, isV4) {
    if (isV4) {
      try {
        ls.setItem(BROKEN_KEY, raw);
        if (ls.getItem(BROKEN_KEY) !== raw) throw new Error('backup');
      } catch (e) {
        return {store: newStore(), canSave: false, msg: '기록을 읽지 못했어요. 이번엔 저장하지 않아요'};
      }
    }
    const r = migrate(newStore());
    return {store: r.store, canSave: r.canSave, msg: BAD_MSG};
  }

  function migrate(store) {
    // 옛 키는 그대로 두고, 새 키를 쓴 뒤 문자열까지 확인해요.
    try {
      const json = JSON.stringify(store);
      ls.setItem(KEY, json);
      return {store: store, canSave: ls.getItem(KEY) === json, msg: ''};
    } catch (e) {
      return {store: store, canSave: false, msg: ''};
    }
  }

  let json;
  try {
    json = ls.getItem(KEY);
  } catch (e) {
    return {store: newStore(), canSave: false, msg: ''};
  }
  if (json !== null && json !== undefined) {
    try {
      const value = JSON.parse(json);
      if (!hasSlots(value) || value.schema !== 4) return unreadable(json, true);
      return {store: normalize(value, false), canSave: true, msg: ''};
    } catch (e) {
      return unreadable(json, true);
    }
  }

  try {
    json = ls.getItem(V3_KEY);
  } catch (e) {
    return {store: newStore(), canSave: false, msg: ''};
  }
  if (json !== null && json !== undefined) {
    let store;
    try {
      const value = JSON.parse(json);
      if (!hasSlots(value)) return unreadable(json, false);
      store = normalize(value, true);
    } catch (e) {
      return unreadable(json, false);
    }
    return migrate(store);
  }

  try {
    json = ls.getItem(V1_KEY);
  } catch (e) {
    return {store: newStore(), canSave: false, msg: ''};
  }
  if (json !== null && json !== undefined) {
    let store;
    try {
      const value = JSON.parse(json);
      if (!value || !Array.isArray(value.stars)) return unreadable(json, false);
      store = newStore();
      store.sound = value.sound !== false;
      store.slots[0].unlocked = integer(value.unlocked, 1, Math.min(10, NLEV));
      store.slots[0].rec.easy = fixRec({stars: value.stars}, 10);
    } catch (e) {
      return unreadable(json, false);
    }
    return migrate(store);
  }

  return {store: newStore(), canSave: true, msg: ''};
}
// v5 저장(game.html과 같은 코드). v4 기록은 그대로 두고 새 키에 복사해서 사탕 지갑·꾸미기·메달·끝없는 기록을 더해요.
// 브라우저에 이 함수 전체를 붙여 넣어 사용할 수 있어요. loadV4 = loadStoreV4.
function loadStoreV5(ls, NLEV, DKEYS, loadV4) {
  const KEY = 'kongkong-adventure-v5';
  const V4_KEY = 'kongkong-adventure-v4';
  const BROKEN_KEY = 'kongkong-adventure-broken-v5';
  const BAD_MSG = '기록을 읽지 못해서 마지막 기록부터 다시 해요';
  // 가게 물건(종류별). 첫 번째는 무료 기본값이에요.
  const ITEMS = {
    color: ['base', 'yellow', 'purple', 'orange', 'sky', 'choco', 'rainbow'],
    hat: ['none', 'cap', 'flower', 'cat', 'bunny', 'party', 'pirate', 'dino', 'wizard'],
    trail: ['none', 'stars', 'hearts', 'bubbles', 'rainbow']
  };

  function integer(value, min, max) {
    let number;
    try { number = Number(value); } catch (e) { number = NaN; } // {"toString":null} 같은 값도 그 칸만 기본값
    return Math.min(max, Math.max(min, Number.isFinite(number) ? Math.trunc(number) : min));
  }
  // 새 숫자 칸은 숫자 타입만 받아요(문자열 "120"·true·[600]은 기본값)
  function num(value, min, max) {
    return typeof value === 'number' && Number.isFinite(value) ? Math.min(max, Math.max(min, Math.trunc(value))) : min;
  }
  function isObj(value) {
    return value !== null && typeof value === 'object' && !Array.isArray(value);
  }

  // 새 칸은 하나씩 따로 검사해요. 한 칸이 이상해도 그 칸만 기본값이 되고 다른 기록은 그대로예요.
  function fixNew(slot, src) {
    const o = isObj(src) ? src : {};
    slot.wallet = num(o.wallet, 0, 999999);
    const free = {color: ITEMS.color[0], hat: ITEMS.hat[0], trail: ITEMS.trail[0]};
    const known = [].concat(ITEMS.color.slice(1).map(function (id) { return 'color:' + id; }),
      ITEMS.hat.slice(1).map(function (id) { return 'hat:' + id; }),
      ITEMS.trail.slice(1).map(function (id) { return 'trail:' + id; }));
    const owned = Array.isArray(o.owned) ? o.owned : [];
    slot.owned = known.filter(function (id) { return owned.indexOf(id) >= 0; });
    const wear = isObj(o.wear) ? o.wear : {};
    slot.wear = {};
    Object.keys(free).forEach(function (kind) {
      const id = wear[kind];
      slot.wear[kind] = typeof id === 'string' && slot.owned.indexOf(kind + ':' + id) >= 0 ? id : free[kind];
    });
    const endless = isObj(o.endless) ? o.endless : {};
    slot.endless = {best: num(endless.best, 0, 999999), runs: num(endless.runs, 0, 999999)};
    const rec = isObj(o.rec) ? o.rec : {};
    DKEYS.forEach(function (key) {
      const r = isObj(rec[key]) ? rec[key] : {};
      const medal = Array.isArray(r.medal) ? r.medal : [];
      slot.rec[key].medal = Array.from({length: NLEV}, function (_, i) {
        const m = medal[i];
        return Number.isInteger(m) && m >= 0 && m <= 3 ? m : 0; // 범위 밖은 금메달로 올리지 않고 0
      });
    });
  }

  function addNew(store, src) {
    const result = JSON.parse(JSON.stringify(store));
    result.schema = 5;
    const slots = isObj(src) && Array.isArray(src.slots) ? src.slots : [];
    result.slots.forEach(function (slot, i) { fixNew(slot, slots[i]); });
    return result;
  }

  // v4 함수로 옛 칸(별·왕관·시간·열린 단계)을 정리해요. 실제 저장소는 건드리지 않아요.
  function oldPart(value) {
    const raw = JSON.stringify(Object.assign({}, value, {schema: 4}));
    const quiet = {
      getItem: function (key) { return key === V4_KEY ? raw : null; },
      setItem: function () {}
    };
    return loadV4(quiet, NLEV, DKEYS);
  }

  function write(store, msg) {
    try {
      const json = JSON.stringify(store);
      ls.setItem(KEY, json);
      return {store: store, canSave: ls.getItem(KEY) === json, msg: msg};
    } catch (e) {
      return {store: store, canSave: false, msg: msg};
    }
  }

  // v5가 없거나 깨졌으면 v4(없으면 v3·v1)에서 옮겨요. 옛 키는 지우지 않아요.
  // v4를 읽을 때 실제 저장소에는 쓰지 않아요(깨진 v4도 원본 그대로 남게). 쓰기는 이 안에서만 기억해요.
  function readOnly() {
    const mem = {};
    return {
      getItem: function (key) { return Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : ls.getItem(key); },
      setItem: function (key, v) { mem[key] = String(v); }
    };
  }
  function fromV4(msg) {
    const r = loadV4(readOnly(), NLEV, DKEYS);
    const store = addNew(r.store, null);
    if (!r.canSave) return {store: store, canSave: false, msg: msg || r.msg};
    return write(store, msg || r.msg);
  }

  let json;
  try {
    json = ls.getItem(KEY);
  } catch (e) {
    return {store: addNew(loadV4({getItem: function () { return null; }, setItem: function () {}}, NLEV, DKEYS).store, null), canSave: false, msg: ''};
  }
  if (json === null || json === undefined) return fromV4('');

  let value = null;
  try { value = JSON.parse(json); } catch (e) { value = null; }
  if (!isObj(value) || value.schema !== 5 || !Array.isArray(value.slots) || value.slots.length !== 3) {
    // 깨진 v5: 원본을 따로 보관한 뒤에만 덮어써요. 보관이 안 되면 이번엔 저장하지 않아요.
    try {
      ls.setItem(BROKEN_KEY, json);
      if (ls.getItem(BROKEN_KEY) !== json) throw new Error('backup');
    } catch (e) {
      const r = fromV4Quiet();
      return {store: r, canSave: false, msg: '기록을 읽지 못했어요. 이번엔 저장하지 않아요'};
    }
    return fromV4(BAD_MSG);
  }
  const old = oldPart(value);
  // 옛 칸 정리에 실패하면 v5 원본은 그대로 두고 이번엔 저장하지 않아요
  if (!old.canSave) return {store: fromV4Quiet(), canSave: false, msg: '기록을 읽지 못했어요. 이번엔 저장하지 않아요'};
  return {store: addNew(old.store, value), canSave: true, msg: ''};

  function fromV4Quiet() {
    const keep = {getItem: function (key) { try { return ls.getItem(key); } catch (e) { return null; } }, setItem: function () {}};
    return addNew(loadV4(keep, NLEV, DKEYS).store, null);
  }
}
// 기본 기록 한 벌(loadStoreV4·V5와 같은 모양 + 메달). 없는 난이도 기록을 만들 때만 써요
const newRec = () => ({stars: Array(NLEV).fill(0), crown: Array(NLEV).fill(false), best: Array(NLEV).fill(0), medal: Array(NLEV).fill(0)});

catch (e) { ({store, canSave, msg: loadMsg} = loadStoreV5({getItem() { throw e; }, setItem() { throw e; }}, NLEV, DKEYS, loadStoreV4)); }

}

let ac = null;
function audio() {

}
function tone(f, d, type = 'square', v = 0.05, f2 = 0, delay = 0) {

    o.type = type; o.frequency.setValueAtTime(f, t);

    gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn).connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const seq = (notes, step, type, v) => notes.forEach((f, i) => tone(f, step * 1.4, type, v, 0, i * step));

// 보스 세기: 쉬워요 3 / 보통 3→4 / 어려워요 4→5. 밟을 틈 1.2 / 1.0 / 0.8초. 단계·난이도가 오르면 조금씩 빨라져요.
function bossCfg() {
  // 밟을 틈(상태가 이어지는 시간): 쉬워요 1.2 … 어른 0.75 / 얼티메이트 0.7. 빠르기는 어른(tier 3) 기준까지만
  const t = D().tier, w = WI(), late = w >= 5;
  return {hp: t === 0 ? 3 : t === 1 ? (late ? 4 : 3) : (late ? 5 : 4), win: [1.2, 1.0, 0.8, 0.75, 0.7][t] || 0.7, bf: 1 + w * 0.04 + Math.min(t, 3) * 0.08};
}
// 대왕 문어: 체력 4/5/6, 머리가 내려와 있는 시간(약점) 2.0/1.6/1.3/1.1초, 예고 0.9초, 먹물 속도 100(어른 120)
// 얼티메이트: 체력 7, 약점 1.0초, 먹물 130, 예고 0.8초(예고는 0.8초보다 짧게 하지 않아요)
const OCTO = {easy: [4, 2.0, 100], normal: [5, 1.6, 100], hard: [6, 1.3, 100], challenge: [6, 1.3, 100], adult: [6, 1.1, 120], ultimate: [7, 1.0, 130]};
function octoCfg() {
  const [hp, weak, ink] = OCTO[SL().diff] || OCTO.easy;
  return {hp, weak, ink, warn: SL().diff === 'ultimate' ? 0.8 : 0.9, win: weak, bf: 1};
}
// 보스가 처음 서 있는 높이: 여왕벌·대왕 문어는 공중, 나머지는 바닥
const bossHome = (kind, h) => kind === 'bee' ? 3 * T : kind === 'octo' ? 2 * T : 10 * T - h;

// 악당 더 놓기: 100칸마다 (난이도 기본 + 단계×0.4)마리가 되도록, 다른 적·가시와 7칸 이상 떨어진 평평한 땅에.
function addExtraEnemies(L) {
  let w = WI(), kinds = idx >= WORLD_LEN ? (idx >= WORLD_LEN + 1 ? ['crab', 'bee'] : ['snail', 'bee'])
    : ['snail'].concat(w >= 1 ? ['bee'] : [], w >= 5 ? ['frog'] : []);
  if (D().groundOnly) kinds = [idx >= WORLD_LEN + 1 ? 'crab' : 'snail'];
  const foe = e => ['snail', 'bee', 'frog', 'crab', 'jelly', 'shark'].includes(e.t);
  const have = L.ents.filter(foe).length;
  const want = Math.round((D().dens + w * 0.4) * L.w / 100) - have;
  if (want <= 0) return [];
  const taken = L.ents.filter(e => foe(e) || e.t === 'spike').map(e => e.x);
  const far = x => taken.every(t => Math.abs(t - x) >= 7);
  const cand = L.spots.filter(far);
  const out = [], step = cand.length / want;
  for (let k = 0; k < want && cand.length; k++) {
    const x = cand[Math.min(cand.length - 1, Math.floor(k * step + step / 2))];
    if (!far(x)) continue;
    taken.push(x);
    const kind = kinds[out.length % kinds.length];
    out.push(kind === 'bee' ? {t:'bee', x, r: out.length % 2 ? 7 : 8} : {t:kind, x, r:9});
  }
  return out;
}
